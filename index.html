  <h1>${escapeHtml(trip.name)}</h1>
  <div class="sub">${isHe?'החל ב-':'Started '}${escapeHtml(fmtDate(startD))}</div>
  <div class="jbadge">${escapeHtml(journalLabel)}</div>
</div>
<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="n">${distinctDays}</div><div class="l">${escapeHtml(t('stats_days'))}</div></div>
    <div class="stat"><div class="n">${countries.size}</div><div class="l">${escapeHtml(t('stats_countries'))}</div></div>
    <div class="stat"><div class="n">${cities.size}</div><div class="l">${escapeHtml(t('stats_cities'))}</div></div>
    <div class="stat"><div class="n">${entries.length}</div><div class="l">${escapeHtml(t('stats_entries'))}</div></div>
  </div>
  <div class="divider"></div>
  ${daysHtml}
  <div class="foot"><div class="fb">Trip <span class="d">diary</span></div><div>${isHe?'נוצר עם Trip diary':'Created with Trip diary'}</div></div>
</div>
</body></html>`;

    return { doc, filename: `${trip.name.replace(/[^\w\u0590-\u05FF]+/g,'-')}-trip-diary` };
  }

  async function exportHtml(){
    if (!state.currentTripId || currentTripEntries().length===0){ toast(t('export_none')); return; }
    toast(t('export_building'));
    const built = await buildExportDoc(false);
    if (!built){ toast(t('export_none')); return; }
    const blob = new Blob([built.doc], {type:'text/html;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download = built.filename + '.html'; a.click();
    closeModal(); toast(t('saved'));
  }

  async function exportPdf(){
    if (!state.currentTripId || currentTripEntries().length===0){ toast(t('export_none')); return; }
    toast(t('export_building'));
    const built = await buildExportDoc(true);
    if (!built){ toast(t('export_none')); return; }
    closeModal();
    const w = window.open('', '_blank');
    if (!w){ toast(t('no_tts')); return; }
    w.document.open(); w.document.write(built.doc); w.document.close();
    // give images/fonts a moment, then open the print dialog (user picks Save as PDF)
    const trigger = () => { try { w.focus(); w.print(); } catch(e){} };
    if (w.document.readyState === 'complete') setTimeout(trigger, 900);
    else w.onload = () => setTimeout(trigger, 900);
  }

  // ============ DARK MODE ============
  async function applyTheme(){ document.body.classList.toggle('dark', theme==='dark'); $('darkBtn').textContent = theme==='dark' ? '☀️' : '🌙'; document.querySelector('meta[name=theme-color]').setAttribute('content', theme==='dark' ? '#08151f' : '#0a2540'); }
  async function toggleTheme(){ theme = theme==='dark' ? 'light' : 'dark'; await store.set('theme', theme); applyTheme(); }

  // ============ GROUP MODE ============
  function setGroupMode(m){ groupMode = m; $('grpDays').classList.toggle('on', m==='days'); $('grpCountries').classList.toggle('on', m==='countries'); renderFeed(); }

  // ============ BACKUP / RESTORE ============
  async function downloadBackup(){
    toast(t('backup_building'));
    // collect all photo/video blobs referenced by entries
    const media = {};
    for (const e of state.entries){
      for (const id of [...(e.photos||[]), ...(e.videos||[])]){
        const d = await photoDB.get(id); if (d) media[id] = d;
      }
    }
    const backup = { version: 1, exportedAt: Date.now(), lang, theme, state, media };
    const blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `trip-diary-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
    closeModal(); toast(t('backup_done'));
  }
  function startRestore(){ $('restoreInput').click(); }
  $('restoreInput').addEventListener('change', async e => {
    const f = (e.target.files||[])[0]; e.target.value='';
    if (!f) return;
    try {
      const txt = await f.text();
      const backup = JSON.parse(txt);
      if (!backup || !backup.state || !Array.isArray(backup.state.trips)) throw new Error('bad');
      if (!confirm(t('restore_confirm'))) return;
      // restore media first
      if (backup.media){ for (const [id, d] of Object.entries(backup.media)){ await photoDB.put(id, d); } }
      state = backup.state;
      if (backup.lang==='he'||backup.lang==='en') lang = backup.lang;
      if (backup.theme) theme = backup.theme;
      await save(); await store.set('lang', lang); await store.set('theme', theme);
      applyTheme(); await setLang(lang); renderAll();
      closeModal(); toast(t('restore_done'));
    } catch(err){ toast(t('restore_bad')); }
  });
  function openBackup(){
    openModal(`<h2>${escapeHtml(t('backup'))}</h2><p class="subtitle">${escapeHtml(t('backup_sub'))}</p>
      <button class="btn" onclick="downloadBackup()">💾 ${escapeHtml(t('backup_download'))}</button>
      <button class="btn secondary" style="margin-top:10px" onclick="startRestore()">↺ ${escapeHtml(t('backup_restore'))}</button>
      <button class="btn secondary" style="margin-top:10px" onclick="closeModal()">${escapeHtml(t('close'))}</button>`);
  }

  // ============ EDIT TAGS & JOURNALS (after save) ============
  let editTagsId = null, editTagsCats = [], editTagsJournals = [];
  function openEditTags(id){
    const e = state.entries.find(x=>x.id===id); if (!e) return;
    editTagsId = id; editTagsCats = [...(e.categories||[])]; editTagsJournals = [...(e.journals||['personal'])];
    const chips = CATEGORIES.map(c=>{ const sel = editTagsCats.includes(c.id);
      return `<button class="cat-chip ${sel?'selected':''}" style="--cat-color:${c.color};--cat-tint:${c.color}1f;--cat-shadow:${c.color}66" onclick="toggleEditCat(this,'${c.id}')"><span class="cat-emoji">${c.emoji}</span><span class="cat-label">${escapeHtml(c[lang]||c.en)}</span></button>`;
    }).join('');
    const jOpt = (key,label)=>{ const on=editTagsJournals.includes(key);
      return `<button class="filter-chip ${on?'on':''}" style="${on?'background:var(--turquoise);color:white;border-color:transparent':''}" onclick="toggleEditJournal(this,'${key}')">${escapeHtml(label)}</button>`; };
    openModal(`<h2>${escapeHtml(t('edit_tags_title'))}</h2>
      <div class="cat-grid">${chips}</div>
      <label style="display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.14em;color:var(--muted);margin-bottom:8px;font-weight:700">${escapeHtml(t('move_to'))}</label>
      <div style="display:flex;gap:8px;margin-bottom:18px" id="editJournals">${jOpt('personal',t('journal_personal'))}${jOpt('shared',t('journal_shared'))}</div>
      <button class="btn" onclick="saveEditTags()">${escapeHtml(t('save_changes'))}</button>
      <button class="btn secondary" style="margin-top:10px" onclick="closeModal()">${escapeHtml(t('cancel'))}</button>`);
  }
  function toggleEditCat(btn,id){ const i=editTagsCats.indexOf(id); if(i>=0){editTagsCats.splice(i,1);btn.classList.remove('selected');} else {editTagsCats.push(id);btn.classList.add('selected');} }
  function toggleEditJournal(btn,key){ const i=editTagsJournals.indexOf(key); if(i>=0){ if(editTagsJournals.length>1){editTagsJournals.splice(i,1);btn.classList.remove('on');btn.style.cssText='';} } else {editTagsJournals.push(key);btn.classList.add('on');btn.style.cssText='background:var(--turquoise);color:white;border-color:transparent';} }
  async function saveEditTags(){
    const e = state.entries.find(x=>x.id===editTagsId); if (!e){ closeModal(); return; }
    e.categories = [...editTagsCats]; e.journals = editTagsJournals.length?[...editTagsJournals]:['personal'];
    await save(); renderAll(); closeModal(); toast(t('saved'));
  }

  // ============ EMERGENCY ============
  function emergencyNumbersForCountry(code, countryName){
    if (code && EMERGENCY_NUMBERS[code]) return { nums: EMERGENCY_NUMBERS[code], known:true };
    // fallback: try to match by English name (older entries / safety)
    if (countryName){ const byName = Object.values(EMERGENCY_NUMBERS).find(e=>e.name===countryName); if (byName) return { nums: byName, known:true }; }
    return { nums: DEFAULT_EMERGENCY, known:false };
  }
  function telLink(num){ return 'tel:' + String(num).replace(/[^0-9+]/g,''); }

  function openOriginPicker(fromEmergency){
    const opts = ORIGIN_COUNTRIES.map(o=>{
      const sel = originCountry===o.code;
      return `<button class="country-opt ${sel?'sel':''}" onclick="chooseOrigin('${o.code}', ${fromEmergency?'true':'false'})"><span class="fl">${o.flag}</span><span>${escapeHtml(o[lang]||o.en)}</span></button>`;
    }).join('');
    openModal(`<h2>${escapeHtml(t('origin_title'))}</h2><p class="subtitle">${escapeHtml(t('origin_sub'))}</p>
      <div class="country-grid">${opts}</div>
      <button class="btn secondary" onclick="closeModal()">${escapeHtml(t('cancel'))}</button>`);
  }
  async function chooseOrigin(code, fromEmergency){
    originCountry = code; originOnboarded = true;
    await store.set('originCountry', code); await store.set('originOnboarded', '1');
    if (fromEmergency) openEmergency(); else closeModal();
  }

  function openEmergency(){
    // 1) BEST: use the GPS ISO country code (language-independent, never localized)
    const gpsCode = (currentLocation && currentLocation.countryCode) ? currentLocation.countryCode : null;
    const rawCountry = (currentLocation && currentLocation.country) ? currentLocation.country : null;
    let code = (gpsCode && EMERGENCY_NUMBERS[gpsCode]) ? gpsCode : null;
    // 2) If code not in table, try resolving the (possibly localized) name to a canonical English name, then to a code
    if (!code && rawCountry){ const cn = canonicalCountry(rawCountry); if (cn){ const hit = Object.entries(EMERGENCY_NUMBERS).find(([k,v])=>v.name===cn); if (hit) code = hit[0]; } }
    let usedFallback = false;
    // 3) If GPS gave us nothing usable at all, fall back to the user's chosen origin country
    if (!code && !rawCountry && originCountry && EMERGENCY_NUMBERS[originCountry]) { code = originCountry; usedFallback = true; }
    const { nums, known } = emergencyNumbersForCountry(code, rawCountry);
    // Display name: prefer the localized GPS name the user sees; else origin; else the table name
    let displayCountry = rawCountry;
    if (!displayCountry && usedFallback && originCountry){ const o = originByCode(originCountry); displayCountry = o ? (o[lang]||o.en) : null; }
    if (!displayCountry && code && EMERGENCY_NUMBERS[code]) displayCountry = EMERGENCY_NUMBERS[code].name;
    const origin = originCountry ? originByCode(originCountry) : null;

    const callRow = (cls, icon, labelKey, num) => `
      <a class="em-call ${cls}" href="${telLink(num)}">
        <span class="em-ic">${icon}</span>
        <span class="em-info"><span class="em-label">${escapeHtml(t(labelKey))}</span><span class="em-num">${escapeHtml(num)}</span></span>
        <span class="em-arrow">›</span>
      </a>`;

    // local emergency block
    let localBlock = '';
    const inCountry = displayCountry ? `${t('em_in')} ${escapeHtml(displayCountry)}` : '';
    localBlock += `<div class="em-section-title">${escapeHtml(t('em_local'))} ${inCountry}</div>`;
    if (!known) localBlock += `<p class="subtitle" style="margin-top:-4px">${escapeHtml(t('em_unknown_country'))}</p>`;
    localBlock += callRow('police', '🚓', 'em_police', nums.police);
    localBlock += callRow('ambulance', '🚑', 'em_ambulance', nums.ambulance);
    localBlock += callRow('fire', '🚒', 'em_fire', nums.fire);

    // embassy block: origin embassy in the current country.
    // When the user is in their OWN home country, show their foreign-ministry / citizens-abroad help instead.
    const inHomeCountry = origin && code && origin.code === code;
    let embassyBlock = `<div class="em-section-title">${escapeHtml(t('em_embassy'))}</div>`;
    if (origin){
      const originName = origin[lang]||origin.en;
      const originEn = origin.en;
      if (inHomeCountry){
        // at home: link to foreign ministry / consular help (useful for relatives abroad, travel advisories)
        const q = `${originEn} ministry of foreign affairs consular assistance`;
        const url = `https://www.google.com/search?q=${encodeURIComponent(q)}`;
        embassyBlock += `<a class="em-embassy-btn" href="${url}" target="_blank" rel="noopener"><span class="eb-ic">🏛️</span><span class="eb-txt">${escapeHtml(t('em_foreign_ministry', { origin: originName }))}</span><span class="eb-arrow">›</span></a>`;
      } else {
        const label = displayCountry
          ? t('em_embassy_btn', { origin: originName, country: displayCountry })
          : t('em_embassy_generic');
        const countryForSearch = (code && EMERGENCY_NUMBERS[code]) ? EMERGENCY_NUMBERS[code].name : rawCountry;
        const q = countryForSearch ? `${originEn} embassy in ${countryForSearch}` : `${originEn} embassy near me`;
        const url = `https://www.google.com/maps/search/${encodeURIComponent(q)}`;
        embassyBlock += `<a class="em-embassy-btn" href="${url}" target="_blank" rel="noopener"><span class="eb-ic">🏛️</span><span class="eb-txt">${escapeHtml(label)}</span><span class="eb-arrow">›</span></a>`;
      }
    } else {
      embassyBlock += `<button class="em-embassy-btn" onclick="openOriginPicker(true)"><span class="eb-ic">🏛️</span><span class="eb-txt">${escapeHtml(t('em_set_origin'))}</span><span class="eb-arrow">›</span></button>`;
    }

    // origin row (change)
    let originRow = '';
    if (origin){
      originRow = `<div class="em-origin-row"><span class="or-left"><span class="fl">${origin.flag}</span>${escapeHtml(origin[lang]||origin.en)}</span><button class="em-change" onclick="openOriginPicker(true)">${escapeHtml(t('origin_change'))}</button></div>`;
    }

    openModal(`<div class="em-modal"><h2>🆘 ${escapeHtml(t('em_title'))}</h2>
      <p class="subtitle" style="margin-bottom:6px">${escapeHtml(t('tap_to_call'))}</p>
      ${localBlock}
      ${embassyBlock}
      ${originRow}
      <div class="em-disclaimer">${escapeHtml(t('em_disclaimer'))}</div>
      <button class="btn secondary" style="margin-top:14px" onclick="closeModal()">${escapeHtml(t('close'))}</button></div>`);
  }

  // expose
  Object.assign(window, { openNewTripModal, submitNewTrip, closeModal, selectTrip, deleteTrip, deleteEntry, editEntry,
    addPhotoToEntry, openManualEntry, submitManual, openCategoryModal, toggleCategory, confirmCategoriesAndRecord,
    removeSessionPhoto, removeSessionVideo, toggleFilter, openLightbox, exportHtml, exportPdf, buildExportDoc,
    setJournalType, openDestinationModal, chooseDestination, toggleSpeak,
    toggleTheme, setGroupMode, downloadBackup, startRestore, openBackup, openEditTags, toggleEditCat, toggleEditJournal, saveEditTags,
    openEmergency, openOriginPicker, chooseOrigin });

  // ============ EVENTS ============
  $('recordBtn').addEventListener('click', ()=>{ haptic(isRecording?[20]:15); if(!state.currentTripId){openNewTripModal();return;} if(isRecording) stopRecording(true); else openCategoryModal(); });
  $('tripsBtn').addEventListener('click', openTripsModal);
  $('exportBtn').addEventListener('click', openExport);
  $('darkBtn').addEventListener('click', toggleTheme);
  $('backupBtn').addEventListener('click', openBackup);
  $('sosBtn').addEventListener('click', openEmergency);
  $('langBtn').addEventListener('click', ()=>setLang(lang==='he'?'en':'he'));
  $('modalBackdrop').addEventListener('click', closeModal);
  $('searchInput').addEventListener('input', e=>{ searchQuery=e.target.value; renderFeed(); });
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click', ()=>{ haptic(8); switchView(b.dataset.view); }));


  // ============ OFFLINE SUPPORT (inline service worker) ============
  // Caches this page (and CDN assets it loads) so the app opens with no connection.
  function registerOfflineSW(){
    if (!('serviceWorker' in navigator)) return;
    // Service workers cannot run from file:// — only when hosted (e.g. GitHub Pages).
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    const swSource = `
      const CACHE = 'tripdiary-v1';
      const PRECACHE = [ self.registration.scope ];
      self.addEventListener('install', e => { self.skipWaiting(); });
      self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
      self.addEventListener('fetch', e => {
        const req = e.request;
        if (req.method !== 'GET') return;
        e.respondWith(
          caches.open(CACHE).then(async cache => {
            const cached = await cache.match(req);
            const network = fetch(req).then(res => {
              if (res && res.status === 200 && (res.type === 'basic' || res.type === 'cors')) {
                cache.put(req, res.clone());
              }
              return res;
            }).catch(() => cached);
            return cached || network;
          })
        );
      });
    `;
    try {
      const blob = new Blob([swSource], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url).catch(()=>{});
    } catch(e){}
  }

  // ============ INIT ============
  (async ()=>{
    await load(); applyTheme(); await setLang(lang); fetchLocation();
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){ const n=document.createElement('div'); n.className='notice'; n.textContent=t('no_speech_notice'); document.querySelector('header').after(n); }
    setTimeout(()=>$('splash').classList.add('hidden'), 1800);
    registerOfflineSW();
    if (!originOnboarded){ setTimeout(()=>{ if(!originOnboarded) openOriginPicker(false); }, 2600); }
  })();
</script>
