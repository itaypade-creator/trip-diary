<!DOCTYPE html>

<meta charset="UTF-8">
<script>
/* ONE-TIME CACHE HEAL — breaks the old cache-first service worker that was pinning
   stale code. Runs once per device, then never again (guarded by localStorage flag). */
(function(){
  try {
    if (localStorage.getItem('sw_healed_v2')) return;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        var hadOld = regs && regs.length;
        Promise.all((regs||[]).map(function(r){ return r.unregister(); }))
          .then(function(){
            if (window.caches && caches.keys) {
              return caches.keys().then(function(keys){
                return Promise.all(keys.map(function(k){ return caches.delete(k); }));
              });
            }
          })
          .then(function(){
            localStorage.setItem('sw_healed_v2','1');
            if (hadOld) location.reload();   // reload once to load fresh files
          });
      }).catch(function(){ localStorage.setItem('sw_healed_v2','1'); });
    } else {
      localStorage.setItem('sw_healed_v2','1');
    }
  } catch(e){}
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800&family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #eef7fa; --bg-tint: #dff1f8; --card: #ffffff; --card-soft: #f7fcfe;
    --ink: #0a2540; --ink-soft: #1e3a5f; --muted: #64748b;
    --line: #cfe6ef; --line-strong: #a7d3e2;
    --primary: #0284c7; --primary-deep: #075985;
    --cyan: #06b6d4; --turquoise: #14b8a6; --turquoise-light: #5eead4; --sky: #38bdf8;
    --grad: linear-gradient(135deg, #22d3ee 0%, #14b8a6 100%);
    --grad-deep: linear-gradient(135deg, #0284c7 0%, #0891b2 50%, #0d9488 100%);
    --red-record: #f43f5e;
    --shadow-sm: 0 1px 2px rgba(2,132,199,0.05), 0 2px 8px -2px rgba(2,132,199,0.08);
    --shadow: 0 1px 2px rgba(2,132,199,0.06), 0 10px 28px -10px rgba(2,132,199,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'Rubik', sans-serif; color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse 80% 50% at 15% 0%, rgba(34,211,238,0.20) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 25%, rgba(20,184,166,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(56,189,248,0.16) 0%, transparent 60%);
    background-attachment: fixed; min-height: 100vh; min-height: 100dvh;
  }
  h1,h2,h3 { letter-spacing: -0.02em; }
  .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum" 1; }

  /* DARK MODE */
  body.dark { --bg:#08151f; --bg-tint:#0e2433; --card:#102633; --card-soft:#0d2030; --ink:#e7f3f8; --ink-soft:#a9c7d4; --muted:#6f8a99; --line:#1d3a4a; --line-strong:#2a536a; }
  body.dark { background-image: radial-gradient(ellipse 80% 50% at 15% 0%, rgba(34,211,238,0.10) 0%, transparent 60%), radial-gradient(ellipse 70% 50% at 90% 25%, rgba(20,184,166,0.10) 0%, transparent 60%), radial-gradient(ellipse 80% 60% at 50% 100%, rgba(56,189,248,0.08) 0%, transparent 60%); }
  body.dark header { background: rgba(8,21,31,0.82); border-bottom-color: #14303f; }
  body.dark .icon-btn, body.dark .tabs, body.dark .journal-toggle, body.dark .search-input, body.dark .filter-chip { background: rgba(16,38,51,0.7); }
  body.dark .location-pill { background: rgba(16,38,51,0.7); }

  /* GROUP-BY toggle */
  .group-toggle { display:flex; gap:6px; padding: 4px 22px 0; }
  .grp-btn { flex:1; padding:7px; border:1px solid var(--line); background:var(--card); border-radius:10px; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:all 0.2s; }
  .grp-btn.on { background: var(--grad); color:white; border-color:transparent; }
  .country-band { display:flex; align-items:center; gap:10px; margin:6px 0 14px; padding:10px 14px; background:linear-gradient(135deg, rgba(34,211,238,0.10), rgba(20,184,166,0.06)); border:1px solid var(--line-strong); border-radius:14px; }
  .country-band .cn { font-weight:800; font-size:16px; }
  .country-band .ce { font-size:18px; }
  .country-band .cc { margin-inline-start:auto; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--turquoise); font-weight:700; }

  /* SPLASH */
  .splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; background: var(--bg);
    background-image: radial-gradient(ellipse 80% 50% at 15% 0%, rgba(34,211,238,0.22) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 25%, rgba(20,184,166,0.20) 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(56,189,248,0.18) 0%, transparent 60%);
    transition: opacity 0.6s ease, transform 0.6s ease; overflow: hidden; }
  .splash-map { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
    color: var(--turquoise); opacity: 0.38; z-index: 0;
    display: flex; align-items: center; justify-content: center;
    animation: splash-map-in 1.4s ease both; }
  .splash-map svg { width: 185%; height: auto; max-height: 130%; }
  body.dark .splash-map { opacity: 0.30; }
  @keyframes splash-map-in { from { transform: scale(1.08);} to { transform: scale(1);} }
  .splash > .splash-icon, .splash > .splash-name, .splash > .splash-tagline { position: relative; z-index: 1; }
  .splash.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }
  .splash-icon { width: 150px; height: 150px; object-fit: contain;
    animation: splash-in 0.9s cubic-bezier(0.2,0.8,0.2,1);
    filter: drop-shadow(0 22px 50px rgba(8,145,178,0.45)) drop-shadow(0 10px 18px rgba(2,132,199,0.35)); }
  .splash-name { font-size: 32px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; direction: ltr;
    animation: splash-text-in 0.9s 0.15s cubic-bezier(0.2,0.8,0.2,1) backwards; display: inline-flex; align-items: baseline; gap: 0; }
  .splash-name .diary-word { color: var(--turquoise); font-weight: 800; }
  .splash-name .diary-script { font-family: 'Caveat', cursive; color: var(--ink); font-weight: 500; font-size: 0.86em; margin-inline-start: -2px; align-self: center; }
  .splash-tagline { margin-top: 2px; color: var(--muted); font-size: 13px; font-weight: 500;
    letter-spacing: 0.05em; text-transform: uppercase;
    animation: splash-text-in 0.9s 0.3s cubic-bezier(0.2,0.8,0.2,1) backwards; }
  @keyframes splash-in { from { opacity: 0; transform: scale(0.7);} to { opacity: 1; transform: scale(1);} }
  @keyframes splash-text-in { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }

  /* LOGO HEADER */
  .logo { position: relative; display: inline-flex; align-items: baseline; font-family: 'Rubik', sans-serif; direction: ltr;
    font-size: 21px; font-weight: 700; letter-spacing: -0.01em; padding-top: 10px; gap: 0; white-space: nowrap; }
  .logo-trip { color: var(--ink); }
  .logo-diary { color: var(--turquoise); font-weight: 800; }
  .logo-script { font-family: 'Caveat', cursive; color: var(--ink); font-weight: 500; font-size: 0.88em; margin-inline-start: -2px; align-self: center; }
  .logo-plane { position: absolute; top: -2px; inset-inline-start: 16%; width: 70%; height: 14px; pointer-events: none; color: var(--turquoise); }
  [dir="rtl"] .logo-plane { transform: scaleX(-1); }

  #app { max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
    padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom); }

  /* HEADER */
  header { padding: calc(16px + env(safe-area-inset-top)) 22px 12px; background: rgba(238,247,250,0.82); position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid rgba(207,230,239,0.6); }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
  .header-top .logo { flex-shrink: 0; min-width: 0; overflow: visible; }
  .header-actions { display: flex; gap: 5px; flex-shrink: 1; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .icon-btn { background: rgba(255,255,255,0.7); border: 1px solid var(--line); border-radius: 100px;
    padding: 8px 11px; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--ink-soft);
    cursor: pointer; transition: all 0.2s ease; backdrop-filter: blur(8px); white-space: nowrap; }
  .icon-btn:active { background: var(--ink); color: white; border-color: var(--ink); transform: scale(0.97); }
  .lang-btn { min-width: 40px; font-weight: 700; }
  #darkBtn, #backupBtn { padding: 8px 9px; font-size: 14px; }
  .trip-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .trip-line .sos-btn { margin-inline-start: auto; }
  .trip-name { font-weight: 700; color: var(--ink-soft); font-size: 15px; }
  .trip-sep { color: var(--line-strong); }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-top: 4px; background: rgba(255,255,255,0.5); padding: 4px; border-radius: 12px; border: 1px solid var(--line); }
  .tab { flex: 1; padding: 8px 6px; border: none; background: transparent; border-radius: 9px; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 5px; }
  .tab svg { width: 15px; height: 15px; }
  .tab.active { background: var(--grad); color: white; box-shadow: 0 4px 12px -3px rgba(20,184,166,0.5); }

  /* JOURNAL TYPE TOGGLE */
  .journal-toggle { display: flex; gap: 0; background: rgba(255,255,255,0.5); padding: 4px; border-radius: 100px; border: 1px solid var(--line); margin-top: 8px; }
  .jt-btn { flex: 1; padding: 8px 6px; border: none; background: transparent; border-radius: 100px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 700; color: var(--muted); transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .jt-btn svg { width: 14px; height: 14px; }
  .jt-btn.active { background: var(--grad); color: white; box-shadow: 0 4px 12px -3px rgba(20,184,166,0.5); }

  /* DESTINATION PICKER */
  .dest-opt { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1.5px solid var(--line);
    border-radius: 16px; background: var(--card); cursor: pointer; margin-bottom: 10px; transition: all 0.18s; }
  .dest-opt:active { transform: scale(0.98); }
  .dest-opt.sel { border-color: var(--turquoise); background: linear-gradient(135deg, rgba(34,211,238,0.08), rgba(20,184,166,0.08)); box-shadow: 0 4px 14px -4px rgba(20,184,166,0.3); }
  .dest-ic { width: 44px; height: 44px; border-radius: 13px; background: var(--grad); display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; }
  .dest-ic svg { width: 22px; height: 22px; }
  .dest-info { flex: 1; }
  .dest-info .tt { font-weight: 700; font-size: 15px; }
  .dest-info .dd { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .dest-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); flex-shrink: 0; transition: all 0.18s; }
  .dest-opt.sel .dest-check { border-color: var(--turquoise); background: var(--turquoise); box-shadow: inset 0 0 0 3px var(--card); }

  /* VIDEO in entries */
  .entry-video { width: 100%; max-width: 280px; border-radius: 12px; margin-top: 10px; border: 1px solid var(--line); display: block; }
  .media-hint { font-size: 12px; color: var(--muted); margin-bottom: 14px; font-style: italic; }
  .video-thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #000; display: flex; align-items: center; justify-content: center; }
  .video-thumb video { width: 100%; height: 100%; object-fit: cover; }
  .video-thumb .play-ic { position: absolute; color: white; font-size: 18px; pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .video-thumb .rm { position: absolute; top: 2px; inset-inline-end: 2px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.6); color: white; border: none; font-size: 12px; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center; z-index: 2; }

  .view { display: none; }
  .view.active { display: block; animation: view-in 0.32s cubic-bezier(0.2,0.8,0.2,1); }
  @keyframes view-in { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }

  /* RECORDER */
  .recorder { padding: 22px 22px 24px; text-align: center; }
  .location-pill { display: inline-flex; align-items: center; gap: 9px; padding: 8px 16px;
    background: rgba(255,255,255,0.7); border: 1px solid var(--line); border-radius: 100px;
    font-size: 13px; font-weight: 500; color: var(--ink-soft); margin-bottom: 28px;
    box-shadow: var(--shadow-sm); max-width: 90%; backdrop-filter: blur(8px); }
  .location-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .location-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--turquoise); flex-shrink: 0; position: relative; }
  .location-dot::after { content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 1.5px solid var(--turquoise); opacity: 0.4; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.6;} 100% { transform: scale(2.4); opacity: 0;} }
  .location-loading .location-dot { background: var(--muted); }
  .location-loading .location-dot::after { border-color: var(--muted); }

  .record-btn { width: 138px; height: 138px; border-radius: 50%; border: none; background: var(--grad);
    color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto;
    position: relative; transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 14px 32px -8px rgba(20,184,166,0.55), 0 4px 12px -2px rgba(6,182,212,0.35),
      inset 0 -4px 0 rgba(0,30,40,0.18), inset 0 2px 0 rgba(255,255,255,0.25); }
  .record-btn:active { transform: scale(0.94); }
  .record-btn .mic-icon { width: 42px; height: 42px; fill: currentColor; }
  .record-btn::before { content: ""; position: absolute; inset: -12px; border: 1.5px dashed var(--line-strong); border-radius: 50%; pointer-events: none; }
  .record-btn.recording { background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); animation: recording-pulse 1.6s ease-in-out infinite; }
  @keyframes recording-pulse {
    0%,100% { box-shadow: 0 14px 32px -8px rgba(244,63,94,0.55), inset 0 -4px 0 rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.2), 0 0 0 0 rgba(244,63,94,0.45); }
    50% { box-shadow: 0 14px 32px -8px rgba(244,63,94,0.55), inset 0 -4px 0 rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.2), 0 0 0 20px rgba(244,63,94,0); } }
  .stop-icon { width: 30px; height: 30px; background: currentColor; border-radius: 6px; }
  .record-label { margin-top: 20px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .write-btn { margin-top: 14px; display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px;
    border-radius: 100px; border: 1px solid var(--line-strong); background: var(--card);
    color: var(--ink-soft); font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    box-shadow: var(--shadow-sm); transition: transform .12s, background .15s, border-color .15s; }
  .write-btn:active { transform: scale(0.96); background: var(--bg-tint); border-color: var(--turquoise); color: var(--primary); }
  .write-btn svg { flex-shrink: 0; }
  .cancel-rec-btn { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
    border-radius: 100px; border: 1.5px solid rgba(244,63,94,0.35); background: rgba(244,63,94,0.08);
    color: #e11d48; font-size: 13px; font-weight: 600; cursor: pointer; transition: transform .12s, background .15s; }
  .cancel-rec-btn:active { transform: scale(0.95); }
  .cancel-rec-btn:hover { background: rgba(244,63,94,0.14); }
  .timer { margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 16px; color: var(--turquoise); font-weight: 500; height: 22px; }
  .live-transcript { margin: 18px auto 0; max-width: 94%; padding: 16px 18px; background: var(--card);
    border-inline-start: 3px solid var(--turquoise); border-radius: 14px; font-size: 15px; line-height: 1.75;
    color: var(--ink-soft); min-height: 52px; box-shadow: var(--shadow-sm); }
  [dir="ltr"] .live-transcript { text-align: left; }
  [dir="rtl"] .live-transcript { text-align: right; }
  .live-transcript.empty { color: var(--muted); font-style: italic; }
  .live-transcript .interim { color: var(--muted); }

  /* SEARCH BAR */
  .search-bar { padding: 0 22px 8px; }
  .search-row { display: flex; gap: 8px; align-items: center; }
  .search-input { flex: 1; padding: 11px 16px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); font-family: inherit; font-size: 14px; color: var(--ink); }
  .search-input:focus { outline: none; border-color: var(--turquoise); box-shadow: 0 0 0 3px rgba(20,184,166,0.12); }
  .filter-scroll { display: flex; gap: 7px; overflow-x: auto; padding: 10px 22px 4px; scrollbar-width: none; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-chip { flex-shrink: 0; padding: 6px 13px; border-radius: 100px; font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); cursor: pointer; white-space: nowrap; }
  .filter-chip.on { color: white; border-color: transparent; }

  /* FEED */
  .feed { flex: 1; padding: 14px 22px 110px; }
  .feed-header { display: flex; align-items: center; gap: 12px; padding: 8px 0 18px; }
  .feed-header h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .feed-header .count { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: white; background: var(--grad);
    padding: 3px 10px; border-radius: 100px; font-weight: 600; }
  .day-group { margin-bottom: 28px; }
  .day-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-sm); }
  .day-stamp { display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 56px; height: 56px; border-radius: 16px; background: var(--grad); color: white; flex-shrink: 0;
    box-shadow: 0 6px 14px -4px rgba(20,184,166,0.45); }
  .day-stamp .num { font-weight: 800; font-size: 22px; line-height: 1; letter-spacing: -0.02em; }
  .day-stamp .label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; margin-top: 2px; opacity: 0.9; font-weight: 600; }
  .day-meta { flex: 1; min-width: 0; }
  .day-date { font-weight: 700; font-size: 16px; color: var(--ink); line-height: 1.25; }
  .day-location { font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 500; }
  .entry { padding: 14px 16px; background: var(--card); border: 1px solid var(--line);
    border-inline-start: 3px solid var(--cyan); border-radius: 14px; margin-bottom: 10px; margin-inline-start: 18px;
    box-shadow: var(--shadow-sm); cursor: pointer; animation: entry-in 0.4s cubic-bezier(0.2,0.8,0.2,1); }
  .entry:active { transform: scale(0.99); }
  @keyframes entry-in { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
  .entry-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
  .entry-time { font-family: 'JetBrains Mono', monospace; color: var(--turquoise); font-weight: 600; font-size: 12px; }
  .entry-loc { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; font-weight: 500; }
  .entry-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
  .entry-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 7px; border-radius: 100px;
    font-size: 11px; font-weight: 600; background: var(--tag-tint); color: var(--tag-color); border: 1px solid var(--tag-border); line-height: 1.4; }
  .entry-tag .e { font-size: 12px; line-height: 1; }
  .entry-text { font-size: 15px; line-height: 1.75; color: var(--ink-soft); white-space: pre-wrap; word-break: break-word; }
  .entry-photos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .entry-photo-wrap { position: relative; width: 72px; height: 72px; }
  .entry-photo { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); cursor: pointer; display: block; }
  .entry-photo-del { position: absolute; top: -6px; inset-inline-end: -6px; width: 22px; height: 22px;
    border-radius: 50%; background: var(--red-record); color: #fff; border: 2px solid var(--card);
    font-size: 14px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25); padding: 0; z-index: 2; }
  .entry-photo-del:active { transform: scale(0.9); filter: brightness(1.05); }
  .entry-actions { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: none; gap: 8px; font-size: 12px; flex-wrap: wrap; }
  .entry.open .entry-actions { display: flex; }
  .entry-action { background: none; border: 1px solid var(--line); color: var(--muted); cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; }
  .entry-action:active { background: var(--bg-tint); color: var(--primary); }
  .entry-action.danger:active { background: rgba(244,63,94,0.1); color: var(--red-record); border-color: var(--red-record); }

  /* EMPTY */
  .empty-state { text-align: center; padding: 24px 30px 30px; color: var(--muted); }
  .empty-state-icon { width: 60px; height: 60px; margin: 0 auto 18px; border-radius: 18px; background: var(--grad);
    display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 10px 24px -6px rgba(20,184,166,0.5); }
  .empty-state-icon svg { width: 30px; height: 30px; }
  .empty-state h3 { font-size: 21px; color: var(--ink); margin-bottom: 10px; font-weight: 700; }
  .empty-state p { font-size: 14px; line-height: 1.65; max-width: 280px; margin: 0 auto; }

  /* MAP VIEW */
  #mapView { padding: 14px 22px 110px; }
  #map { width: 100%; height: 420px; border-radius: 18px; border: 1px solid var(--line); box-shadow: var(--shadow); z-index: 1; }
  .map-empty { text-align: center; padding: 60px 30px; color: var(--muted); }

  /* STATS VIEW */
  #statsView { padding: 18px 22px 110px; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
  .stat-box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px; box-shadow: var(--shadow-sm); }
  .stat-box .n { font-size: 32px; font-weight: 900; letter-spacing: -0.03em; color: var(--turquoise); line-height: 1; }
  .stat-box .l { font-size: 13px; color: var(--muted); margin-top: 8px; font-weight: 500; }
  .stats-section-title { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 24px 0 14px; }
  .country-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; box-shadow: var(--shadow-sm); }
  .country-row .flag { font-size: 22px; }
  .country-row .name { flex: 1; font-weight: 600; font-size: 14.5px; }
  .country-row .cnt { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--turquoise); font-weight: 600; }
  .cat-stat { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  .cat-stat .bar { flex: 1; height: 8px; background: var(--bg-tint); border-radius: 100px; overflow: hidden; }
  .cat-stat .bar span { display: block; height: 100%; background: var(--grad); border-radius: 100px; }
  .cat-stat .cnt { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); font-weight: 600; min-width: 24px; text-align: center; }

  /* MODAL */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(10,37,64,0.55); backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px); z-index: 100; display: none; align-items: flex-end; justify-content: center; animation: backdrop-in 0.2s; }
  @keyframes backdrop-in { from { opacity: 0;} to { opacity: 1;} }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--bg); width: 100%; max-width: 520px; border-radius: 24px 24px 0 0;
    padding: 22px 22px 32px; padding-bottom: calc(32px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto;
    animation: modal-in 0.32s cubic-bezier(0.2,0.8,0.2,1);
    background-image: radial-gradient(ellipse at 0% 0%, rgba(34,211,238,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(20,184,166,0.12) 0%, transparent 50%); }
  @keyframes modal-in { from { transform: translateY(100%);} to { transform: translateY(0);} }
  .modal-handle { width: 40px; height: 4px; background: var(--line-strong); border-radius: 2px; margin: -8px auto 18px; }
  .modal h2 { font-size: 22px; margin-bottom: 6px; font-weight: 800; }
  .modal .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 22px; line-height: 1.55; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 7px; font-weight: 700; }
  .form-group input[type=text], .form-group input[type=date], .manual-input { width: 100%; padding: 13px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-family: inherit; font-size: 16px; color: var(--ink);
    transition: border-color 0.2s, box-shadow 0.2s; }
  .form-group input:focus, .manual-input:focus { outline: none; border-color: var(--turquoise); box-shadow: 0 0 0 3px rgba(20,184,166,0.15); }
  .manual-input { min-height: 120px; resize: vertical; line-height: 1.65; font-family: inherit; }
  .btn { width: 100%; padding: 14px; background: var(--grad-deep); color: white; border: none; border-radius: 12px;
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 6px 16px -4px rgba(2,132,199,0.4); }
  .btn:active { transform: scale(0.98); }
  .btn.secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); box-shadow: none; }
  .trip-list { margin-bottom: 18px; }
  .trip-item { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--line);
    border-radius: 14px; margin-bottom: 8px; background: var(--card); cursor: pointer; transition: all 0.2s; }
  .trip-item.active { border-color: var(--turquoise); background: linear-gradient(135deg, rgba(34,211,238,0.08), rgba(20,184,166,0.08));
    border-inline-start: 4px solid var(--turquoise); box-shadow: 0 4px 14px -4px rgba(20,184,166,0.25); }
  .trip-item-info { flex: 1; min-width: 0; }
  .trip-item-name { font-weight: 700; font-size: 15px; }
  .trip-item-meta { font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 500; }
  .delete-x { background: none; border: 1px solid var(--line); color: var(--muted); width: 32px; height: 32px;
    border-radius: 50%; font-size: 18px; cursor: pointer; line-height: 1; transition: all 0.2s; }
  .delete-x:active { background: rgba(244,63,94,0.1); color: var(--red-record); border-color: var(--red-record); }

  /* CATEGORIES */
  .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .cat-chip { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 13px 6px 11px;
    border: 1.5px solid var(--line); border-radius: 16px; background: var(--card); cursor: pointer;
    transition: transform 0.15s, border-color 0.2s, background 0.2s, box-shadow 0.2s; font-family: inherit; user-select: none; }
  .cat-chip:active { transform: scale(0.94); }
  .cat-chip.selected { border-color: var(--cat-color); background: var(--cat-tint); box-shadow: 0 4px 14px -4px var(--cat-shadow); }
  .cat-emoji { font-size: 24px; line-height: 1; }
  .cat-label { font-size: 11px; font-weight: 600; color: var(--ink-soft); }
  .cat-chip.selected .cat-label { color: var(--cat-color); }
  .cat-counter { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px;
    padding: 0 7px; border-radius: 100px; background: rgba(255,255,255,0.25); color: white; font-size: 11px; font-weight: 700; margin-inline-start: 8px; }

  /* PHOTO PICKER in record/manual */
  .photo-add-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .photo-thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-thumb .rm { position: absolute; top: 2px; inset-inline-end: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,0.6); color: white; border: none; font-size: 12px; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .photo-add-btn { width: 64px; height: 64px; border-radius: 10px; border: 1.5px dashed var(--line-strong); background: var(--card);
    color: var(--turquoise); font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* LIGHTBOX */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 12px; }
  .lightbox .close-lb { position: absolute; top: 20px; inset-inline-end: 20px; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.2); border: none; color: white; font-size: 22px; cursor: pointer; }

  /* TOAST */
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--ink); color: white; padding: 12px 22px; border-radius: 100px; font-size: 14px; font-weight: 500;
    z-index: 200; transition: transform 0.3s cubic-bezier(0.2,0.8,0.2,1); box-shadow: 0 14px 36px -10px rgba(10,37,64,0.4);
    max-width: calc(100vw - 40px); text-align: center; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  /* EMERGENCY */
  .sos-btn { background: linear-gradient(135deg,#f43f5e,#e11d48) !important; color:#fff !important; border:none !important;
    font-weight:800 !important; box-shadow:0 4px 12px -3px rgba(244,63,94,0.55); display:flex; align-items:center; gap:5px; }
  .sos-btn:active { transform: scale(0.96); filter:brightness(1.05); }
  .sos-dot { width:7px; height:7px; border-radius:50%; background:#fff; position:relative; }
  .sos-dot::after { content:""; position:absolute; inset:-3px; border-radius:50%; border:1.5px solid #fff; opacity:0.5; animation:pulse 1.8s ease-out infinite; }

  .em-modal h2 { color:#e11d48; display:flex; align-items:center; gap:8px; }
  .em-section-title { font-size:11px; text-transform:uppercase; letter-spacing:0.16em; color:var(--muted); font-weight:700; margin:22px 0 12px; }
  .em-call { display:flex; align-items:center; gap:14px; padding:15px 16px; border-radius:16px; margin-bottom:9px;
    text-decoration:none; border:1px solid; transition:transform 0.15s; }
  .em-call:active { transform:scale(0.98); }
  .em-call.police { background:rgba(59,130,246,0.10); border-color:rgba(59,130,246,0.35); }
  .em-call.ambulance { background:rgba(244,63,94,0.10); border-color:rgba(244,63,94,0.35); }
  .em-call.fire { background:rgba(249,115,22,0.10); border-color:rgba(249,115,22,0.35); }
  .em-call .em-ic { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; color:#fff; }
  .em-call.police .em-ic { background:#3b82f6; }
  .em-call.ambulance .em-ic { background:#f43f5e; }
  .em-call.fire .em-ic { background:#f97316; }
  .em-call .em-info { flex:1; min-width:0; }
  .em-call .em-label { font-size:13px; color:var(--muted); font-weight:600; }
  .em-call .em-num { font-size:24px; font-weight:900; color:var(--ink); letter-spacing:-0.02em; line-height:1.1; font-family:'JetBrains Mono',monospace; }
  .em-call .em-arrow { color:var(--muted); font-size:18px; }
  .em-country-line { font-size:14px; color:var(--ink-soft); font-weight:600; margin-bottom:4px; }
  .em-embassy-btn { display:flex; align-items:center; gap:12px; width:100%; padding:15px 16px; border-radius:16px;
    background:var(--card); border:1px solid var(--line); cursor:pointer; font-family:inherit; text-align:start; transition:transform 0.15s; text-decoration:none; }
  .em-embassy-btn:active { transform:scale(0.98); }
  .em-embassy-btn .eb-ic { width:42px; height:42px; border-radius:12px; background:var(--grad); display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0; }
  .em-embassy-btn .eb-txt { flex:1; font-weight:600; font-size:14.5px; color:var(--ink); }
  .em-embassy-btn .eb-arrow { color:var(--muted); }
  .em-disclaimer { font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:18px; padding:12px 14px; background:var(--card-soft); border:1px solid var(--line); border-radius:12px; }
  .em-origin-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:6px; }
  .em-origin-row .or-left { display:flex; align-items:center; gap:10px; font-weight:600; font-size:14.5px; }
  .em-origin-row .or-left .fl { font-size:20px; }
  .em-change { background:none; border:none; color:var(--primary); font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .country-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:18px; }
  .country-opt { display:flex; align-items:center; gap:10px; padding:13px 14px; border:1.5px solid var(--line); border-radius:14px;
    background:var(--card); cursor:pointer; font-family:inherit; font-size:14.5px; font-weight:600; color:var(--ink); transition:all 0.15s; }
  .country-opt:active { transform:scale(0.97); }
  .country-opt.sel { border-color:var(--turquoise); background:linear-gradient(135deg, rgba(34,211,238,0.08), rgba(20,184,166,0.08)); }
  .country-opt .fl { font-size:20px; }

  .notice { margin: 14px 22px 0; padding: 12px 16px; background: rgba(34,211,238,0.1); border: 1px solid rgba(20,184,166,0.3);
    border-radius: 12px; font-size: 13px; color: var(--primary-deep); line-height: 1.55; font-weight: 500; }
</style>

<body>

<!-- SPLASH -->
<div class="splash" id="splash">
  <div class="splash-map" aria-hidden="true">
    <svg viewBox="0 0 1000 500" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <g stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" fill="currentColor" fill-opacity="0.10">
        <!-- North America -->
        <path d="M150 95 L235 80 L300 100 L280 140 L300 165 L255 205 L240 250 L210 235 L205 195 L165 175 L140 135 Z"/>
        <!-- Central + South America -->
        <path d="M255 250 L285 260 L300 300 L335 320 L320 370 L300 430 L280 400 L285 345 L260 300 Z"/>
        <!-- Greenland -->
        <path d="M360 55 L405 50 L420 85 L390 110 L360 90 Z"/>
        <!-- Europe -->
        <path d="M470 110 L540 100 L560 130 L540 160 L500 165 L478 145 Z"/>
        <!-- Africa -->
        <path d="M500 200 L575 195 L600 240 L585 305 L545 365 L515 330 L505 270 L490 235 Z"/>
        <!-- Asia -->
        <path d="M560 95 L720 85 L820 110 L860 150 L820 195 L740 200 L660 185 L600 160 L575 130 Z"/>
        <!-- India -->
        <path d="M650 200 L700 205 L690 255 L665 240 Z"/>
        <!-- SE Asia / Indonesia -->
        <path d="M760 230 L830 245 L870 270 L820 290 L770 270 Z"/>
        <!-- Australia -->
        <path d="M800 330 L885 325 L905 370 L860 405 L805 385 L790 350 Z"/>
      </g>
      <!-- dotted flight arcs -->
      <g stroke="currentColor" stroke-width="2.4" stroke-dasharray="3 8" stroke-linecap="round" fill="none" opacity="0.9">
        <path d="M250 180 Q 420 70, 540 140"/>
        <path d="M560 150 Q 700 230, 840 360"/>
        <path d="M300 320 Q 460 320, 560 250"/>
      </g>
      <g fill="currentColor">
        <circle cx="250" cy="180" r="5"/><circle cx="540" cy="140" r="5"/>
        <circle cx="840" cy="360" r="5"/><circle cx="300" cy="320" r="5"/>
      </g>
    </svg>
  </div>
  <img class="splash-icon" src="icon.png" alt="Trip Diary">
  <div class="splash-name"><span>Trip</span><span class="diary-word">D</span><span class="diary-script">iary</span></div>
  <div class="splash-tagline" data-i18n="tagline">Your journey, in your voice</div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-top">
      <div class="logo">
        <svg class="logo-plane" viewBox="0 0 100 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M2 11 Q 30 2, 78 4" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2.5" stroke-linecap="round"/>
          <path d="M73 1 L 86 4 L 76 6.5 L 73 11 L 71 6.5 Z" fill="currentColor"/>
        </svg>
        <span class="logo-trip">Trip</span><span class="logo-diary">D</span><span class="logo-script">iary</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="darkBtn" title="dark mode">🌙</button>
        <button class="icon-btn" id="backupBtn" title="backup">💾</button>
        <button class="icon-btn" id="exportBtn" data-i18n="export">Export</button>
        <button class="icon-btn lang-btn" id="langBtn">עב</button>
        <button class="icon-btn" id="tripsBtn" data-i18n="trips">Trips</button>
      </div>
    </div>
    <div class="trip-line" id="tripLine"><span class="trip-name">—</span><button class="icon-btn sos-btn" id="sosBtn"><span class="sos-dot"></span><span data-i18n="sos">SOS</span></button></div>
    <div class="tabs">
      <button class="tab active" data-view="journal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span data-i18n="tab_journal">Journal</span>
      </button>
      <button class="tab" data-view="map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span data-i18n="tab_map">Map</span>
      </button>
      <button class="tab" data-view="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
        <span data-i18n="tab_stats">Stats</span>
      </button>
    </div>
    <div class="journal-toggle" id="journalToggle">
      <button class="jt-btn active" id="jtPersonal" onclick="setJournalType('personal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span data-i18n="journal_personal">Personal</span>
      </button>
      <button class="jt-btn" id="jtShared" onclick="setJournalType('shared')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span data-i18n="journal_shared">Shared</span>
      </button>
    </div>
  </header>

  <!-- JOURNAL VIEW -->
  <div class="view active" id="journalView">
    <section class="recorder">
      <div class="location-pill location-loading" id="locationPill">
        <span class="location-dot"></span>
        <span class="location-text" id="locationText" data-i18n="locating">Locating…</span>
      </div>
      <button class="record-btn" id="recordBtn" aria-label="Record">
        <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>
      </button>
      <div class="record-label" id="recordLabel" data-i18n="tap_to_record">Tap to record</div>
      <button class="write-btn" id="writeBtn" onclick="openManualEntry()">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span data-i18n="write_entry">Write</span>
      </button>
      <button class="cancel-rec-btn" id="cancelRecBtn" style="display:none" aria-label="Cancel recording">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
        <span data-i18n="cancel_rec">Cancel</span>
      </button>
      <div class="timer mono" id="timer"></div>
      <div class="live-transcript empty" id="liveTranscript" style="display:none"><span data-i18n="start_speaking">Start speaking…</span></div>
    </section>

    <div class="search-bar" id="searchBar" style="display:none">
      <div class="search-row">
        <input type="text" class="search-input" id="searchInput" data-i18n-ph="search_ph" placeholder="Search entries…">
      </div>
    </div>
    <div class="filter-scroll" id="filterScroll" style="display:none"></div>
    <div class="group-toggle" id="groupToggle" style="display:none">
      <button class="grp-btn on" id="grpDays" onclick="setGroupMode('days')" data-i18n="group_days">By day</button>
      <button class="grp-btn" id="grpCountries" onclick="setGroupMode('countries')" data-i18n="group_countries">By country</button>
    </div>

    <main class="feed" id="feed"></main>
  </div>

  <!-- MAP VIEW -->
  <div class="view" id="mapView">
    <div id="map"></div>
    <div class="map-empty" id="mapEmpty" style="display:none"></div>
  </div>

  <!-- STATS VIEW -->
  <div class="view" id="statsView"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div id="modalContent"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="close-lb" id="closeLb">×</button>
  <img id="lightboxImg" src="" alt="">
</div>

<div class="toast" id="toast"></div>

<input type="file" id="photoInput" accept="image/*" multiple style="display:none">
<input type="file" id="videoInput" accept="video/*" style="display:none">
<input type="file" id="restoreInput" accept="application/json,.json" style="display:none">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js?v=20260525"></script>
</body>
</html>
