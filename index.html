<style>
  :root {
    --bg: #eef7fa; --bg-tint: #dff1f8; --card: #ffffff; --card-soft: #f7fcfe;
    --ink: #0a2540; --ink-soft: #1e3a5f; --muted: #64748b;
    --line: #cfe6ef; --line-strong: #a7d3e2;
    --primary: #0284c7; --primary-deep: #075985;
    --cyan: #06b6d4; --turquoise: #14b8a6; --turquoise-light: #5eead4; --sky: #38bdf8;
    --grad: linear-gradient(135deg, #22d3ee 0%, #14b8a6 100%);
    --grad-deep: linear-gradient(135deg, #0284c7 0%, #0891b2 50%, #0d9488 100%);
    --red-record: #f43f5e;
    --shadow-sm: 0 1px 2px rgba(2,132,199,0.05), 0 2px 8px -2px rgba(2,132,199,0.08);
    --shadow: 0 1px 2px rgba(2,132,199,0.06), 0 10px 28px -10px rgba(2,132,199,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'Rubik', sans-serif; color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse 80% 50% at 15% 0%, rgba(34,211,238,0.20) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 25%, rgba(20,184,166,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(56,189,248,0.16) 0%, transparent 60%);
    background-attachment: fixed; min-height: 100vh; min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  h1,h2,h3 { letter-spacing: -0.02em; }
  .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum" 1; }

  /* DARK MODE */
  body.dark { --bg:#08151f; --bg-tint:#0e2433; --card:#102633; --card-soft:#0d2030; --ink:#e7f3f8; --ink-soft:#a9c7d4; --muted:#6f8a99; --line:#1d3a4a; --line-strong:#2a536a; }
  body.dark { background-image: radial-gradient(ellipse 80% 50% at 15% 0%, rgba(34,211,238,0.10) 0%, transparent 60%), radial-gradient(ellipse 70% 50% at 90% 25%, rgba(20,184,166,0.10) 0%, transparent 60%), radial-gradient(ellipse 80% 60% at 50% 100%, rgba(56,189,248,0.08) 0%, transparent 60%); }
  body.dark header { background: rgba(8,21,31,0.82); border-bottom-color: #14303f; }
  body.dark .icon-btn, body.dark .tabs, body.dark .journal-toggle, body.dark .search-input, body.dark .filter-chip { background: rgba(16,38,51,0.7); }
  body.dark .location-pill { background: rgba(16,38,51,0.7); }

  /* GROUP-BY toggle */
  .group-toggle { display:flex; gap:6px; padding: 4px 22px 0; }
  .grp-btn { flex:1; padding:7px; border:1px solid var(--line); background:var(--card); border-radius:10px; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:all 0.2s; }
  .grp-btn.on { background: var(--grad); color:white; border-color:transparent; }
  .country-band { display:flex; align-items:center; gap:10px; margin:6px 0 14px; padding:10px 14px; background:linear-gradient(135deg, rgba(34,211,238,0.10), rgba(20,184,166,0.06)); border:1px solid var(--line-strong); border-radius:14px; }
  .country-band .cn { font-weight:800; font-size:16px; }
  .country-band .ce { font-size:18px; }
  .country-band .cc { margin-inline-start:auto; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--turquoise); font-weight:700; }

  /* SPLASH */
  .splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px; background: var(--bg);
    background-image: radial-gradient(ellipse 80% 50% at 15% 0%, rgba(34,211,238,0.22) 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 90% 25%, rgba(20,184,166,0.20) 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(56,189,248,0.18) 0%, transparent 60%);
    transition: opacity 0.6s ease, transform 0.6s ease; }
  .splash.hidden { opacity: 0; pointer-events: none; transform: scale(1.05); }
  .splash-icon { width: 150px; height: 150px; object-fit: contain;
    animation: splash-in 0.9s cubic-bezier(0.2,0.8,0.2,1);
    filter: drop-shadow(0 22px 50px rgba(8,145,178,0.45)) drop-shadow(0 10px 18px rgba(2,132,199,0.35)); }
  .splash-name { font-size: 32px; font-weight: 700; color: var(--ink); letter-spacing: -0.02em;
    animation: splash-text-in 0.9s 0.15s cubic-bezier(0.2,0.8,0.2,1) backwards; display: flex; align-items: baseline; gap: 6px; }
  .splash-name .diary-word { color: var(--turquoise); font-style: italic; font-weight: 600; }
  .splash-tagline { margin-top: 2px; color: var(--muted); font-size: 13px; font-weight: 500;
    letter-spacing: 0.05em; text-transform: uppercase;
    animation: splash-text-in 0.9s 0.3s cubic-bezier(0.2,0.8,0.2,1) backwards; }
  @keyframes splash-in { from { opacity: 0; transform: scale(0.7);} to { opacity: 1; transform: scale(1);} }
  @keyframes splash-text-in { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }

  /* LOGO HEADER */
  .logo { position: relative; display: inline-flex; align-items: baseline; font-family: 'Rubik', sans-serif;
    font-size: 21px; font-weight: 700; letter-spacing: -0.025em; padding-top: 10px; gap: 4px; white-space: nowrap; }
  .logo-trip { color: var(--ink); }
  .logo-diary { color: var(--turquoise); font-style: italic; font-weight: 600; }
  .logo-plane { position: absolute; top: -2px; inset-inline-start: 16%; width: 70%; height: 14px; pointer-events: none; color: var(--turquoise); }
  [dir="rtl"] .logo-plane { transform: scaleX(-1); }

  #app { max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

  /* HEADER */
  header { padding: 16px 22px 12px; background: rgba(238,247,250,0.82); position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid rgba(207,230,239,0.6); }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
  .header-top .logo { flex-shrink: 1; min-width: 0; overflow: hidden; }
  .header-actions { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }
  .icon-btn { background: rgba(255,255,255,0.7); border: 1px solid var(--line); border-radius: 100px;
    padding: 8px 11px; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--ink-soft);
    cursor: pointer; transition: all 0.2s ease; backdrop-filter: blur(8px); white-space: nowrap; }
  .icon-btn:active { background: var(--ink); color: white; border-color: var(--ink); transform: scale(0.97); }
  .lang-btn { min-width: 40px; font-weight: 700; }
  #darkBtn, #backupBtn { padding: 8px 9px; font-size: 14px; }
  .trip-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .trip-name { font-weight: 700; color: var(--ink-soft); font-size: 15px; }
  .trip-sep { color: var(--line-strong); }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-top: 4px; background: rgba(255,255,255,0.5); padding: 4px; border-radius: 12px; border: 1px solid var(--line); }
  .tab { flex: 1; padding: 8px 6px; border: none; background: transparent; border-radius: 9px; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 5px; }
  .tab svg { width: 15px; height: 15px; }
  .tab.active { background: var(--grad); color: white; box-shadow: 0 4px 12px -3px rgba(20,184,166,0.5); }

  /* JOURNAL TYPE TOGGLE */
  .journal-toggle { display: flex; gap: 0; background: rgba(255,255,255,0.5); padding: 4px; border-radius: 100px; border: 1px solid var(--line); margin-top: 8px; }
  .jt-btn { flex: 1; padding: 8px 6px; border: none; background: transparent; border-radius: 100px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 700; color: var(--muted); transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .jt-btn svg { width: 14px; height: 14px; }
  .jt-btn.active { background: var(--grad); color: white; box-shadow: 0 4px 12px -3px rgba(20,184,166,0.5); }

  /* DESTINATION PICKER */
  .dest-opt { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1.5px solid var(--line);
    border-radius: 16px; background: var(--card); cursor: pointer; margin-bottom: 10px; transition: all 0.18s; }
  .dest-opt:active { transform: scale(0.98); }
  .dest-opt.sel { border-color: var(--turquoise); background: linear-gradient(135deg, rgba(34,211,238,0.08), rgba(20,184,166,0.08)); box-shadow: 0 4px 14px -4px rgba(20,184,166,0.3); }
  .dest-ic { width: 44px; height: 44px; border-radius: 13px; background: var(--grad); display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; }
  .dest-ic svg { width: 22px; height: 22px; }
  .dest-info { flex: 1; }
  .dest-info .tt { font-weight: 700; font-size: 15px; }
  .dest-info .dd { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .dest-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); flex-shrink: 0; transition: all 0.18s; }
  .dest-opt.sel .dest-check { border-color: var(--turquoise); background: var(--turquoise); box-shadow: inset 0 0 0 3px var(--card); }

  /* VIDEO in entries */
  .entry-video { width: 100%; max-width: 280px; border-radius: 12px; margin-top: 10px; border: 1px solid var(--line); display: block; }
  .media-hint { font-size: 12px; color: var(--muted); margin-bottom: 14px; font-style: italic; }
  .video-thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #000; display: flex; align-items: center; justify-content: center; }
  .video-thumb video { width: 100%; height: 100%; object-fit: cover; }
  .video-thumb .play-ic { position: absolute; color: white; font-size: 18px; pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
  .video-thumb .rm { position: absolute; top: 2px; inset-inline-end: 2px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.6); color: white; border: none; font-size: 12px; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center; z-index: 2; }

  .view { display: none; }
  .view.active { display: block; animation: view-in 0.32s cubic-bezier(0.2,0.8,0.2,1); }
  @keyframes view-in { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }

  /* RECORDER */
  .recorder { padding: 22px 22px 24px; text-align: center; }
  .location-pill { display: inline-flex; align-items: center; gap: 9px; padding: 8px 16px;
    background: rgba(255,255,255,0.7); border: 1px solid var(--line); border-radius: 100px;
    font-size: 13px; font-weight: 500; color: var(--ink-soft); margin-bottom: 28px;
    box-shadow: var(--shadow-sm); max-width: 90%; backdrop-filter: blur(8px); }
  .location-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .location-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--turquoise); flex-shrink: 0; position: relative; }
  .location-dot::after { content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 1.5px solid var(--turquoise); opacity: 0.4; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.6;} 100% { transform: scale(2.4); opacity: 0;} }
  .location-loading .location-dot { background: var(--muted); }
  .location-loading .location-dot::after { border-color: var(--muted); }

  .record-btn { width: 138px; height: 138px; border-radius: 50%; border: none; background: var(--grad);
    color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto;
    position: relative; transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 14px 32px -8px rgba(20,184,166,0.55), 0 4px 12px -2px rgba(6,182,212,0.35),
      inset 0 -4px 0 rgba(0,30,40,0.18), inset 0 2px 0 rgba(255,255,255,0.25); }
  .record-btn:active { transform: scale(0.94); }
  .record-btn .mic-icon { width: 42px; height: 42px; fill: currentColor; }
  .record-btn::before { content: ""; position: absolute; inset: -12px; border: 1.5px dashed var(--line-strong); border-radius: 50%; pointer-events: none; }
  .record-btn.recording { background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%); animation: recording-pulse 1.6s ease-in-out infinite; }
  @keyframes recording-pulse {
    0%,100% { box-shadow: 0 14px 32px -8px rgba(244,63,94,0.55), inset 0 -4px 0 rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.2), 0 0 0 0 rgba(244,63,94,0.45); }
    50% { box-shadow: 0 14px 32px -8px rgba(244,63,94,0.55), inset 0 -4px 0 rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.2), 0 0 0 20px rgba(244,63,94,0); } }
  .stop-icon { width: 30px; height: 30px; background: currentColor; border-radius: 6px; }
  .record-label { margin-top: 20px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .timer { margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 16px; color: var(--turquoise); font-weight: 500; height: 22px; }
  .live-transcript { margin: 18px auto 0; max-width: 94%; padding: 16px 18px; background: var(--card);
    border-inline-start: 3px solid var(--turquoise); border-radius: 14px; font-size: 15px; line-height: 1.75;
    color: var(--ink-soft); min-height: 52px; box-shadow: var(--shadow-sm); }
  [dir="ltr"] .live-transcript { text-align: left; }
  [dir="rtl"] .live-transcript { text-align: right; }
  .live-transcript.empty { color: var(--muted); font-style: italic; }
  .live-transcript .interim { color: var(--muted); }

  /* SEARCH BAR */
  .search-bar { padding: 0 22px 8px; }
  .search-row { display: flex; gap: 8px; align-items: center; }
  .search-input { flex: 1; padding: 11px 16px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); font-family: inherit; font-size: 14px; color: var(--ink); }
  .search-input:focus { outline: none; border-color: var(--turquoise); box-shadow: 0 0 0 3px rgba(20,184,166,0.12); }
  .filter-scroll { display: flex; gap: 7px; overflow-x: auto; padding: 10px 22px 4px; scrollbar-width: none; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-chip { flex-shrink: 0; padding: 6px 13px; border-radius: 100px; font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); cursor: pointer; white-space: nowrap; }
  .filter-chip.on { color: white; border-color: transparent; }

  /* FEED */
  .feed { flex: 1; padding: 14px 22px 110px; }
  .feed-header { display: flex; align-items: center; gap: 12px; padding: 8px 0 18px; }
  .feed-header h2 { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
  .feed-header .count { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: white; background: var(--grad);
    padding: 3px 10px; border-radius: 100px; font-weight: 600; }
  .day-group { margin-bottom: 28px; }
  .day-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; padding: 12px 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-sm); }
  .day-stamp { display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 56px; height: 56px; border-radius: 16px; background: var(--grad); color: white; flex-shrink: 0;
    box-shadow: 0 6px 14px -4px rgba(20,184,166,0.45); }
  .day-stamp .num { font-weight: 800; font-size: 22px; line-height: 1; letter-spacing: -0.02em; }
  .day-stamp .label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; margin-top: 2px; opacity: 0.9; font-weight: 600; }
  .day-meta { flex: 1; min-width: 0; }
  .day-date { font-weight: 700; font-size: 16px; color: var(--ink); line-height: 1.25; }
  .day-location { font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 500; }
  .entry { padding: 14px 16px; background: var(--card); border: 1px solid var(--line);
    border-inline-start: 3px solid var(--cyan); border-radius: 14px; margin-bottom: 10px; margin-inline-start: 18px;
    box-shadow: var(--shadow-sm); cursor: pointer; animation: entry-in 0.4s cubic-bezier(0.2,0.8,0.2,1); }
  .entry:active { transform: scale(0.99); }
  @keyframes entry-in { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
  .entry-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
  .entry-time { font-family: 'JetBrains Mono', monospace; color: var(--turquoise); font-weight: 600; font-size: 12px; }
  .entry-loc { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; font-weight: 500; }
  .entry-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
  .entry-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 7px; border-radius: 100px;
    font-size: 11px; font-weight: 600; background: var(--tag-tint); color: var(--tag-color); border: 1px solid var(--tag-border); line-height: 1.4; }
  .entry-tag .e { font-size: 12px; line-height: 1; }
  .entry-text { font-size: 15px; line-height: 1.75; color: var(--ink-soft); white-space: pre-wrap; word-break: break-word; }
  .entry-photos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .entry-photo { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); cursor: pointer; }
  .entry-actions { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: none; gap: 8px; font-size: 12px; flex-wrap: wrap; }
  .entry.open .entry-actions { display: flex; }
  .entry-action { background: none; border: 1px solid var(--line); color: var(--muted); cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; }
  .entry-action:active { background: var(--bg-tint); color: var(--primary); }
  .entry-action.danger:active { background: rgba(244,63,94,0.1); color: var(--red-record); border-color: var(--red-record); }

  /* EMPTY */
  .empty-state { text-align: center; padding: 24px 30px 30px; color: var(--muted); }
  .empty-state-icon { width: 60px; height: 60px; margin: 0 auto 18px; border-radius: 18px; background: var(--grad);
    display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 10px 24px -6px rgba(20,184,166,0.5); }
  .empty-state-icon svg { width: 30px; height: 30px; }
  .empty-state h3 { font-size: 21px; color: var(--ink); margin-bottom: 10px; font-weight: 700; }
  .empty-state p { font-size: 14px; line-height: 1.65; max-width: 280px; margin: 0 auto; }

  /* MAP VIEW */
  #mapView { padding: 14px 22px 110px; }
  #map { width: 100%; height: 420px; border-radius: 18px; border: 1px solid var(--line); box-shadow: var(--shadow); z-index: 1; }
  .map-empty { text-align: center; padding: 60px 30px; color: var(--muted); }

  /* STATS VIEW */
  #statsView { padding: 18px 22px 110px; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
  .stat-box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px; box-shadow: var(--shadow-sm); }
  .stat-box .n { font-size: 32px; font-weight: 900; letter-spacing: -0.03em; color: var(--turquoise); line-height: 1; }
  .stat-box .l { font-size: 13px; color: var(--muted); margin-top: 8px; font-weight: 500; }
  .stats-section-title { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 24px 0 14px; }
  .country-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; box-shadow: var(--shadow-sm); }
  .country-row .flag { font-size: 22px; }
  .country-row .name { flex: 1; font-weight: 600; font-size: 14.5px; }
  .country-row .cnt { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--turquoise); font-weight: 600; }
  .cat-stat { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  .cat-stat .bar { flex: 1; height: 8px; background: var(--bg-tint); border-radius: 100px; overflow: hidden; }
  .cat-stat .bar span { display: block; height: 100%; background: var(--grad); border-radius: 100px; }
  .cat-stat .cnt { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); font-weight: 600; min-width: 24px; text-align: center; }

  /* MODAL */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(10,37,64,0.55); backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px); z-index: 100; display: none; align-items: flex-end; justify-content: center; animation: backdrop-in 0.2s; }
  @keyframes backdrop-in { from { opacity: 0;} to { opacity: 1;} }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--bg); width: 100%; max-width: 520px; border-radius: 24px 24px 0 0;
    padding: 22px 22px 32px; padding-bottom: calc(32px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto;
    animation: modal-in 0.32s cubic-bezier(0.2,0.8,0.2,1);
    background-image: radial-gradient(ellipse at 0% 0%, rgba(34,211,238,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 100%, rgba(20,184,166,0.12) 0%, transparent 50%); }
  @keyframes modal-in { from { transform: translateY(100%);} to { transform: translateY(0);} }
  .modal-handle { width: 40px; height: 4px; background: var(--line-strong); border-radius: 2px; margin: -8px auto 18px; }
  .modal h2 { font-size: 22px; margin-bottom: 6px; font-weight: 800; }
  .modal .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 22px; line-height: 1.55; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 7px; font-weight: 700; }
  .form-group input[type=text], .form-group input[type=date], .manual-input { width: 100%; padding: 13px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-family: inherit; font-size: 16px; color: var(--ink);
    transition: border-color 0.2s, box-shadow 0.2s; }
  .form-group input:focus, .manual-input:focus { outline: none; border-color: var(--turquoise); box-shadow: 0 0 0 3px rgba(20,184,166,0.15); }
  .manual-input { min-height: 120px; resize: vertical; line-height: 1.65; font-family: inherit; }
  .btn { width: 100%; padding: 14px; background: var(--grad-deep); color: white; border: none; border-radius: 12px;
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 6px 16px -4px rgba(2,132,199,0.4); }
  .btn:active { transform: scale(0.98); }
  .btn.secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); box-shadow: none; }
  .trip-list { margin-bottom: 18px; }
  .trip-item { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--line);
    border-radius: 14px; margin-bottom: 8px; background: var(--card); cursor: pointer; transition: all 0.2s; }
  .trip-item.active { border-color: var(--turquoise); background: linear-gradient(135deg, rgba(34,211,238,0.08), rgba(20,184,166,0.08));
    border-inline-start: 4px solid var(--turquoise); box-shadow: 0 4px 14px -4px rgba(20,184,166,0.25); }
  .trip-item-info { flex: 1; min-width: 0; }
  .trip-item-name { font-weight: 700; font-size: 15px; }
  .trip-item-meta { font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 500; }
  .delete-x { background: none; border: 1px solid var(--line); color: var(--muted); width: 32px; height: 32px;
    border-radius: 50%; font-size: 18px; cursor: pointer; line-height: 1; transition: all 0.2s; }
  .delete-x:active { background: rgba(244,63,94,0.1); color: var(--red-record); border-color: var(--red-record); }

  /* CATEGORIES */
  .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .cat-chip { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 13px 6px 11px;
    border: 1.5px solid var(--line); border-radius: 16px; background: var(--card); cursor: pointer;
    transition: transform 0.15s, border-color 0.2s, background 0.2s, box-shadow 0.2s; font-family: inherit; user-select: none; }
  .cat-chip:active { transform: scale(0.94); }
  .cat-chip.selected { border-color: var(--cat-color); background: var(--cat-tint); box-shadow: 0 4px 14px -4px var(--cat-shadow); }
  .cat-emoji { font-size: 24px; line-height: 1; }
  .cat-label { font-size: 11px; font-weight: 600; color: var(--ink-soft); }
  .cat-chip.selected .cat-label { color: var(--cat-color); }
  .cat-counter { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px;
    padding: 0 7px; border-radius: 100px; background: rgba(255,255,255,0.25); color: white; font-size: 11px; font-weight: 700; margin-inline-start: 8px; }

  /* PHOTO PICKER in record/manual */
  .photo-add-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .photo-thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-thumb .rm { position: absolute; top: 2px; inset-inline-end: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,0.6); color: white; border: none; font-size: 12px; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .photo-add-btn { width: 64px; height: 64px; border-radius: 10px; border: 1.5px dashed var(--line-strong); background: var(--card);
    color: var(--turquoise); font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* LIGHTBOX */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 90vh; border-radius: 12px; }
  .lightbox .close-lb { position: absolute; top: 20px; inset-inline-end: 20px; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.2); border: none; color: white; font-size: 22px; cursor: pointer; }

  /* TOAST */
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--ink); color: white; padding: 12px 22px; border-radius: 100px; font-size: 14px; font-weight: 500;
    z-index: 200; transition: transform 0.3s cubic-bezier(0.2,0.8,0.2,1); box-shadow: 0 14px 36px -10px rgba(10,37,64,0.4);
    max-width: calc(100vw - 40px); text-align: center; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  /* EMERGENCY */
  .sos-btn { background: linear-gradient(135deg,#f43f5e,#e11d48) !important; color:#fff !important; border:none !important;
    font-weight:800 !important; box-shadow:0 4px 12px -3px rgba(244,63,94,0.55); display:flex; align-items:center; gap:5px; }
  .sos-btn:active { transform: scale(0.96); filter:brightness(1.05); }
  .sos-dot { width:7px; height:7px; border-radius:50%; background:#fff; position:relative; }
  .sos-dot::after { content:""; position:absolute; inset:-3px; border-radius:50%; border:1.5px solid #fff; opacity:0.5; animation:pulse 1.8s ease-out infinite; }

  .em-modal h2 { color:#e11d48; display:flex; align-items:center; gap:8px; }
  .em-section-title { font-size:11px; text-transform:uppercase; letter-spacing:0.16em; color:var(--muted); font-weight:700; margin:22px 0 12px; }
  .em-call { display:flex; align-items:center; gap:14px; padding:15px 16px; border-radius:16px; margin-bottom:9px;
    text-decoration:none; border:1px solid; transition:transform 0.15s; }
  .em-call:active { transform:scale(0.98); }
  .em-call.police { background:rgba(59,130,246,0.10); border-color:rgba(59,130,246,0.35); }
  .em-call.ambulance { background:rgba(244,63,94,0.10); border-color:rgba(244,63,94,0.35); }
  .em-call.fire { background:rgba(249,115,22,0.10); border-color:rgba(249,115,22,0.35); }
  .em-call .em-ic { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; color:#fff; }
  .em-call.police .em-ic { background:#3b82f6; }
  .em-call.ambulance .em-ic { background:#f43f5e; }
  .em-call.fire .em-ic { background:#f97316; }
  .em-call .em-info { flex:1; min-width:0; }
  .em-call .em-label { font-size:13px; color:var(--muted); font-weight:600; }
  .em-call .em-num { font-size:24px; font-weight:900; color:var(--ink); letter-spacing:-0.02em; line-height:1.1; font-family:'JetBrains Mono',monospace; }
  .em-call .em-arrow { color:var(--muted); font-size:18px; }
  .em-country-line { font-size:14px; color:var(--ink-soft); font-weight:600; margin-bottom:4px; }
  .em-embassy-btn { display:flex; align-items:center; gap:12px; width:100%; padding:15px 16px; border-radius:16px;
    background:var(--card); border:1px solid var(--line); cursor:pointer; font-family:inherit; text-align:start; transition:transform 0.15s; text-decoration:none; }
  .em-embassy-btn:active { transform:scale(0.98); }
  .em-embassy-btn .eb-ic { width:42px; height:42px; border-radius:12px; background:var(--grad); display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0; }
  .em-embassy-btn .eb-txt { flex:1; font-weight:600; font-size:14.5px; color:var(--ink); }
  .em-embassy-btn .eb-arrow { color:var(--muted); }
  .em-disclaimer { font-size:11.5px; color:var(--muted); line-height:1.5; margin-top:18px; padding:12px 14px; background:var(--card-soft); border:1px solid var(--line); border-radius:12px; }
  .em-origin-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:6px; }
  .em-origin-row .or-left { display:flex; align-items:center; gap:10px; font-weight:600; font-size:14.5px; }
  .em-origin-row .or-left .fl { font-size:20px; }
  .em-change { background:none; border:none; color:var(--primary); font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .country-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:18px; }
  .country-opt { display:flex; align-items:center; gap:10px; padding:13px 14px; border:1.5px solid var(--line); border-radius:14px;
    background:var(--card); cursor:pointer; font-family:inherit; font-size:14.5px; font-weight:600; color:var(--ink); transition:all 0.15s; }
  .country-opt:active { transform:scale(0.97); }
  .country-opt.sel { border-color:var(--turquoise); background:linear-gradient(135deg, rgba(34,211,238,0.08), rgba(20,184,166,0.08)); }
  .country-opt .fl { font-size:20px; }

  .notice { margin: 14px 22px 0; padding: 12px 16px; background: rgba(34,211,238,0.1); border: 1px solid rgba(20,184,166,0.3);
    border-radius: 12px; font-size: 13px; color: var(--primary-deep); line-height: 1.55; font-weight: 500; }
</style>
</head>

  // Pan-EU + many others accept 112 as a universal fallback.
  const DEFAULT_EMERGENCY = { police:'112', ambulance:'112', fire:'112' };

  // Reverse-geocode may return localized country names (e.g. Hebrew). Map common ones to the English keys above.
  const COUNTRY_ALIASES = {
    'ישראל':'Israel', 'ארצות הברית':'United States', 'ארהב':'United States', 'בריטניה':'United Kingdom',
    'אנגליה':'United Kingdom', 'קנדה':'Canada', 'אוסטרליה':'Australia', 'תאילנד':'Thailand', 'וייטנאם':'Vietnam',
    'הודו':'India', 'יפן':'Japan', 'סין':'China', 'גרמניה':'Germany', 'צרפת':'France', 'איטליה':'Italy',
    'ספרד':'Spain', 'הולנד':'Netherlands', 'יוון':'Greece', 'ברזיל':'Brazil', 'מקסיקו':'Mexico',
    'ארגנטינה':'Argentina', 'פרו':'Peru', 'אינדונזיה':'Indonesia', 'הפיליפינים':'Philippines', 'קמבודיה':'Cambodia',
    'לאוס':'Laos', 'נפאל':'Nepal', 'סרי לנקה':'Sri Lanka', 'טורקיה':'Turkey', 'פורטוגל':'Portugal',

  // Map an origin ISO code to the English country name used in EMERGENCY_NUMBERS
  const ORIGIN_CODE_TO_NAME = { IL:'Israel', US:'United States', GB:'United Kingdom', CA:'Canada', AU:'Australia',
    DE:'Germany', FR:'France', IT:'Italy', ES:'Spain', NL:'Netherlands', RU:'Russia', BR:'Brazil', IN:'India', CN:'China', JP:'Japan' };

  // Resolve any country string (English or localized) to the canonical English key, or null.
  function canonicalCountry(name){
    if (!name) return null;
    if (EMERGENCY_NUMBERS[name]) return name;            // already an English key
    if (COUNTRY_ALIASES[name]) return COUNTRY_ALIASES[name]; // localized alias
    // try case-insensitive match on English keys
    const lower = name.toLowerCase();
    const hit = Object.keys(EMERGENCY_NUMBERS).find(k => k.toLowerCase() === lower);
    return hit || null;
  }


  // ============ STORAGE (data) ============

  // ============ PHOTO STORAGE (IndexedDB) ============
  // Photos can be large; keep them out of the main JSON, in IndexedDB by id.
  const photoDB = {
    _db: null,
    async open() {
      if (this._db) return this._db;

        try {
          const req = indexedDB.open('tripdiary-photos', 1);
          req.onupgradeneeded = e => { e.target.result.createObjectStore('photos'); };
          req.onsuccess = e => { this._db = e.target.result; resolve(this._db); };
          req.onerror = () => resolve(null);
        } catch(e) { resolve(null); }
      });
    },
    async put(id, dataUrl) {
      const db = await this.open(); if (!db) return;
      return new Promise(res => { const tx = db.transaction('photos','readwrite'); tx.objectStore('photos').put(dataUrl, id); tx.oncomplete=()=>res(); tx.onerror=()=>res(); });
    },
    async get(id) {
      const db = await this.open(); if (!db) return null;
      return new Promise(res => { const tx = db.transaction('photos','readonly'); const r = tx.objectStore('photos').get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); });
    },
    async del(id) {
      const db = await this.open(); if (!db) return;
      return new Promise(res => { const tx = db.transaction('photos','readwrite'); tx.objectStore('photos').delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>res(); });

  function fmtDate(d) {
    const m = I18N[lang].months;

  function daysSince(s, e){ const a=new Date(s),b=new Date(e); a.setHours(0,0,0,0); b.setHours(0,0,0,0); return Math.floor((b-a)/86400000)+1; }
  function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ============ LOCATION ============
  async function fetchLocation() {
    if (!navigator.geolocation) { $('locationPill').classList.remove('location-loading'); $('locationText').textContent=t('no_location'); return null; }
    return new Promise(resolve => {
      navigator.geolocation.getCurrentPosition(async pos => {
        const { latitude, longitude } = pos.coords;
        currentLocation = { lat: latitude, lng: longitude };
        try {
          const lc = lang==='he'?'he':'en';
          const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json&accept-language=${lc}`);
          const d = await r.json(); const a = d.address || {};
          currentLocation.city = a.city||a.town||a.village||a.municipality||a.county||a.state||'';
          currentLocation.country = a.country||'';
          currentLocation.countryCode = (a.country_code||'').toUpperCase();
          const txt = [currentLocation.city, currentLocation.country].filter(Boolean).join(', ') || `${latitude.toFixed(2)}°, ${longitude.toFixed(2)}°`;
          $('locationText').textContent = txt;
        } catch(e){ $('locationText').textContent = `${latitude.toFixed(2)}°, ${longitude.toFixed(2)}°`; }
        $('locationPill').classList.remove('location-loading'); resolve(currentLocation);
      }, () => { $('locationPill').classList.remove('location-loading'); $('locationText').textContent=t('no_location'); resolve(null); },
      { enableHighAccuracy:false, timeout:8000, maximumAge:60000 });
    });

  // ============ RECORDING ============
  function setupRecognition(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR(); r.lang = lang==='he'?'he-IL':'en-US'; r.continuous = true; r.interimResults = true; return r;
  }
  function startRecording() {
    finalTranscript=''; interimTranscript='';
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { openManualEntry(); return; }
    recognition = setupRecognition();
    recognition.onresult = e => {
      interimTranscript='';
      for (let i=e.resultIndex; i<e.results.length; i++){ const tx=e.results[i][0].transcript; if (e.results[i].isFinal) finalTranscript+=tx+' '; else interimTranscript+=tx; }
      updateLiveTranscript();
    };
    recognition.onerror = e => { if (e.error==='not-allowed'){ toast(t('no_mic')); stopRecording(false);} else if (e.error==='language-not-supported') toast(t('no_hebrew')); };
    recognition.onend = () => { if (isRecording){ try{ recognition.start(); }catch(e){ setTimeout(()=>{ if(isRecording){ try{recognition.start();}catch(_){}} },300); } } };
    try { recognition.start(); } catch(e){ toast(t('rec_error')); return; }
    isRecording = true; recordStartTime = Date.now();
    const b=$('recordBtn'); b.classList.add('recording'); b.innerHTML='<div class="stop-icon"></div>';
    $('recordLabel').textContent=t('recording'); $('liveTranscript').style.display='block'; updateLiveTranscript();
    timerInterval = setInterval(()=>{ const s=Math.floor((Date.now()-recordStartTime)/1000); $('timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }, 250);
  }
  function updateLiveTranscript(){
    const el=$('liveTranscript'); const f=finalTranscript.trim(), i=interimTranscript.trim();
    if (!f && !i){ el.innerHTML=`<span>${escapeHtml(t('start_speaking'))}</span>`; el.classList.add('empty'); }
    else { el.classList.remove('empty'); el.innerHTML = escapeHtml(f) + (i?'<span class="interim"> '+escapeHtml(i)+'</span>':''); }
  }
  async function stopRecording(savePresent=true){

    const b=$('recordBtn'); b.classList.remove('recording');
    b.innerHTML='<svg class="mic-icon" viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-3.08A7 7 0 0019 11h-2z"/></svg>';

  // ============ PHOTOS ============
  function compressImage(file, maxDim=1280, quality=0.72){
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim){ height = height*maxDim/width; width = maxDim; }
          else if (height > maxDim){ width = width*maxDim/height; height = maxDim; }
          const canvas = document.createElement('canvas'); canvas.width=width; canvas.height=height;
          canvas.getContext('2d').drawImage(img,0,0,width,height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => resolve(null);
        img.src = e.target.result;
      };
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    });
  }
  let photoTargetRender = null; // function to refresh thumbs in the open modal
  $('photoInput').addEventListener('change', async e => {
    const files = Array.from(e.target.files || []);
    for (const f of files){

  async function saveEntry(text, journals){

      location: currentLocation ? {...currentLocation} : null, categories: [...sessionCategories],
      photos: photoIds, videos: videoIds, journals: journals || ['personal'] };

  // ============ TEXT-TO-SPEECH (read aloud) ============
  let speakingId = null;
  function pickVoice(text){
    const voices = window.speechSynthesis.getVoices() || [];
    // detect Hebrew characters -> prefer he voice, else en
    const isHe = /[\u0590-\u05FF]/.test(text);
    const want = isHe ? 'he' : 'en';
    let v = voices.find(x => x.lang && x.lang.toLowerCase().startsWith(want));
    if (!v && isHe) v = voices.find(x => x.lang && x.lang.toLowerCase().startsWith('iw')); // legacy Hebrew code
    return { voice: v || null, lang: isHe ? 'he-IL' : 'en-US' };
  }
  function resetListenButtons(){
    document.querySelectorAll('.listen-btn').forEach(b => { b.innerHTML = '🔊 ' + t('listen'); });
  }
  function toggleSpeak(id, btn){
    if (!('speechSynthesis' in window)){ toast(t('no_tts')); return; }
    const synth = window.speechSynthesis;
    // if this entry is already speaking -> stop
    if (speakingId === id){ synth.cancel(); speakingId = null; resetListenButtons(); return; }
    // stop anything else first
    synth.cancel(); resetListenButtons();
    const e = state.entries.find(x=>x.id===id);
    if (!e || !e.text){ return; }
    const { voice, lang } = pickVoice(e.text);
    const u = new SpeechSynthesisUtterance(e.text);
    u.lang = lang; if (voice) u.voice = voice; u.rate = 1; u.pitch = 1;
    u.onend = () => { speakingId = null; resetListenButtons(); };
    u.onerror = () => { speakingId = null; resetListenButtons(); };
    speakingId = id;
    if (btn) btn.innerHTML = '⏹ ' + t('stop_listen');
    synth.speak(u);
  }

  function entryHtml(e, showDateInHead){

  function renderFeed(){
    const feed=$('feed');
    if (!state.currentTripId){
      $('searchBar').style.display='none'; $('filterScroll').style.display='none'; $('groupToggle').style.display='none';
      feed.innerHTML = `<div class="empty-state">
        <div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L13.5 8.5L20 10L13.5 11.5L12 18L10.5 11.5L4 10L10.5 8.5L12 2Z"/></svg></div>
        <h3>${escapeHtml(t('welcome_title'))}</h3><p>${escapeHtml(t('welcome_sub'))}</p>
        <button class="btn" style="margin-top:22px;max-width:220px" onclick="openNewTripModal()">${escapeHtml(t('create_trip'))}</button></div>`;
      return;
    }
    const trip = state.trips.find(tr=>tr.id===state.currentTripId);
    const all = currentTripEntries();
    if (all.length === 0){
      $('searchBar').style.display='none'; $('filterScroll').style.display='none'; $('groupToggle').style.display='none';
      const eTitle = journalType==='shared' ? t('empty_shared_title') : t('empty_title');
      const eSub = journalType==='shared' ? t('empty_shared_sub') : t('empty_sub');
      feed.innerHTML = `<div class="feed-header"><h2>${escapeHtml(journalType==='shared'?t('viewing_shared'):t('viewing_personal'))}</h2><span class="count">0</span></div>
        <div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/></svg></div>
        <h3>${escapeHtml(eTitle)}</h3><p>${escapeHtml(eSub)}</p></div>`;
      return;
    }
    $('searchBar').style.display='block';
    $('groupToggle').style.display='flex';
    renderFilters();

    const entries = filteredEntries();
    if (entries.length === 0){
      $('groupToggle').style.display='none';
      feed.innerHTML = `<div class="feed-header"><h2>${escapeHtml(t('journal'))}</h2><span class="count">0</span></div>
        <div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></div>
        <h3>${escapeHtml(t('no_results'))}</h3><p>${escapeHtml(t('no_results_sub'))}</p></div>`;
      return;
    }

    let html = `<div class="feed-header"><h2>${escapeHtml(t('journal'))}</h2><span class="count">${entries.length}</span></div>`;

    if (groupMode === 'countries'){
      // group by country (preserve recency: order countries by latest entry)
      const groups = {};
      entries.forEach(e => { const c = (e.location && e.location.country) ? e.location.country : (lang==='he'?'ללא מיקום':'No location'); (groups[c]=groups[c]||[]).push(e); });
      const order = Object.keys(groups).sort((a,b)=> Math.max(...groups[b].map(e=>e.timestamp)) - Math.max(...groups[a].map(e=>e.timestamp)));
      order.forEach(country => {
        const de = groups[country];
        html += `<div class="day-group"><div class="country-band"><span class="ce">🌍</span><span class="cn">${escapeHtml(country)}</span><span class="cc">${de.length} ${escapeHtml(pluralEntries(de.length))}</span></div>`;
        de.forEach(e => { html += entryHtml(e, true); });
        html += '</div>';
      });
    } else {
      const groups = {};
      entries.forEach(e => { const k=dateKey(e.timestamp); (groups[k]=groups[k]||[]).push(e); });
      Object.keys(groups).sort().reverse().forEach(k => {
        const de = groups[k]; const d = new Date(de[0].timestamp);
        const dayNum = daysSince(trip.startDate, d.toISOString());
        const locs = de.map(e=>e.location).filter(Boolean);
        const city = locs.map(l=>l.city).filter(Boolean)[0]||'';
        const country = locs.map(l=>l.country).filter(Boolean)[0]||'';
        const locLine = [city,country].filter(Boolean).join(', ');
        html += `<div class="day-group"><div class="day-header">
          <div class="day-stamp"><div class="num">${dayNum}</div><div class="label">${escapeHtml(t('day_label'))}</div></div>
          <div class="day-meta"><div class="day-date">${escapeHtml(I18N[lang].days_full[d.getDay()])}, ${escapeHtml(fmtDate(d))}</div>
          ${locLine?`<div class="day-location">⌖ ${escapeHtml(locLine)}</div>`:''}</div></div>`;
        de.forEach(e => { html += entryHtml(e, false); });
        html += '</div>';
      });
    }
    feed.innerHTML = html;
    // lazy-load photos from IndexedDB
    entries.forEach(async e => {
      if (e.photos && e.photos.length){
        const c = feed.querySelector(`[data-photos="${e.id}"]`);
        if (c){ for (const pid of e.photos){ const url = await photoDB.get(pid); if (url){ const img=document.createElement('img'); img.className='entry-photo'; img.src=url; img.onclick=ev=>{ev.stopPropagation();openLightbox(url);}; c.appendChild(img); } } }
      }
      if (e.videos && e.videos.length){
        const cv = feed.querySelector(`[data-videos="${e.id}"]`);
        if (cv){ for (const vid of e.videos){ const url = await photoDB.get(vid); if (url){ const v=document.createElement('video'); v.className='entry-video'; v.src=url; v.controls=true; v.playsInline=true; v.onclick=ev=>ev.stopPropagation(); cv.appendChild(v); } } }
      }
    });
  }

  // ============ MAP VIEW ============
  function renderMap(){
    if (typeof L === 'undefined'){
      $('map').style.display='none';
      const me=$('mapEmpty'); me.style.display='block';
      me.innerHTML=`<div class="empty-state-icon" style="margin-bottom:18px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div><h3 style="color:var(--ink);font-size:20px;margin-bottom:8px">${lang==='he'?'המפה דורשת חיבור לאינטרנט':'Map needs an internet connection'}</h3><p>${lang==='he'?'התחבר לאינטרנט כדי לראות את המסלול על המפה':'Connect to the internet to see your route on the map'}</p>`;
      return;
    }
    const entries = currentTripEntries().filter(e=>e.location && e.location.lat);
    if (entries.length === 0){
      $('map').style.display='none';
      const me=$('mapEmpty'); me.style.display='block';
      me.innerHTML=`<div class="empty-state-icon" style="margin-bottom:18px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></div><h3 style="color:var(--ink);font-size:20px;margin-bottom:8px">${escapeHtml(t('map_empty'))}</h3><p>${escapeHtml(t('map_empty_sub'))}</p>`;
      return;
    }
    $('map').style.display='block'; $('mapEmpty').style.display='none';
    if (!mapInstance){
      mapInstance = L.map('map', { scrollWheelZoom:true });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(mapInstance);
    }
    if (mapLayer) mapLayer.remove();
    mapLayer = L.layerGroup().addTo(mapInstance);
    const pts = [];
    // chronological for the path line
    const chrono = [...entries].sort((a,b)=>a.timestamp-b.timestamp);
    chrono.forEach(e=>{
      const ll=[e.location.lat,e.location.lng]; pts.push(ll);
      const icon = L.divIcon({ className:'', html:`<div style="width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#14b8a6);border:2.5px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3)"></div>`, iconSize:[18,18], iconAnchor:[9,9] });
      const loc=[e.location.city,e.location.country].filter(Boolean).join(', ');
      const when=new Date(e.timestamp);
      L.marker(ll,{icon}).addTo(mapLayer).bindPopup(`<b>${escapeHtml(loc||'—')}</b><br>${escapeHtml(fmtDate(when))} ${fmtTime(when)}<br>${escapeHtml((e.text||'').slice(0,80))}${(e.text||'').length>80?'…':''}`);
    });
    if (pts.length>1) L.polyline(pts,{color:'#14b8a6',weight:3,opacity:0.6,dashArray:'6 8'}).addTo(mapLayer);
    const bounds = L.latLngBounds(pts);
    mapInstance.fitBounds(bounds, { padding:[40,40], maxZoom:12 });
    setTimeout(()=>mapInstance.invalidateSize(), 100);
  }

  // ============ STATS VIEW ============
  function renderStats(){
    const sv=$('statsView');
    const entries = currentTripEntries();
    const trip = state.trips.find(tr=>tr.id===state.currentTripId);
    if (!trip || entries.length===0){
      sv.innerHTML = `<div class="empty-state"><div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg></div><h3 style="color:var(--ink);font-size:20px;margin-bottom:8px">${escapeHtml(t('stats_overview'))}</h3><p>${escapeHtml(t('stats_no_data'))}</p></div>`;
      return;
    }
    const countries = {}, cities = new Set();
    let photoCount = 0;
    const catCount = {};
    entries.forEach(e=>{
      if (e.location){ if (e.location.country) countries[e.location.country]=(countries[e.location.country]||0)+1; if (e.location.city) cities.add(e.location.city); }
      if (e.photos) photoCount += e.photos.length;
      (e.categories||[]).forEach(c=>catCount[c]=(catCount[c]||0)+1);
    });
    const tripDays = daysSince(trip.startDate, new Date().toISOString());
    const distinctDays = new Set(entries.map(e=>dateKey(e.timestamp))).size;

    const topCountries = Object.entries(countries).sort((a,b)=>b[1]-a[1]);
    const maxCat = Math.max(1, ...Object.values(catCount));
    const topCats = Object.entries(catCount).sort((a,b)=>b[1]-a[1]);

    let html = `<div class="stats-section-title">${escapeHtml(t('stats_overview'))}</div>
      <div class="stats-grid">
        <div class="stat-box"><div class="n">${Object.keys(countries).length}</div><div class="l">${escapeHtml(t('stats_countries'))}</div></div>
        <div class="stat-box"><div class="n">${cities.size}</div><div class="l">${escapeHtml(t('stats_cities'))}</div></div>
        <div class="stat-box"><div class="n">${entries.length}</div><div class="l">${escapeHtml(t('stats_entries'))}</div></div>
        <div class="stat-box"><div class="n">${distinctDays}</div><div class="l">${escapeHtml(t('stats_days'))}</div></div>
        <div class="stat-box"><div class="n">${photoCount}</div><div class="l">${escapeHtml(t('stats_photos'))}</div></div>
        <div class="stat-box"><div class="n">${tripDays}</div><div class="l">${lang==='he'?'יום נוכחי בטיול':'Current trip day'}</div></div>
      </div>`;
    if (topCountries.length){
      html += `<div class="stats-section-title">${escapeHtml(t('stats_top_countries'))}</div>`;
      topCountries.forEach(([c,n])=>{ html += `<div class="country-row"><span class="flag">🌍</span><span class="name">${escapeHtml(c)}</span><span class="cnt">${n}</span></div>`; });
    }
    if (topCats.length){
      html += `<div class="stats-section-title">${escapeHtml(t('stats_moods'))}</div>`;
      topCats.forEach(([cid,n])=>{ const c=catById(cid); if(!c) return; const pct=Math.round(n/maxCat*100);
        html += `<div class="cat-stat"><span style="font-size:18px">${c.emoji}</span><span style="font-size:13.5px;font-weight:600;min-width:54px">${escapeHtml(c[lang]||c.en)}</span><div class="bar"><span style="width:${pct}%"></span></div><span class="cnt">${n}</span></div>`; });
    }
    sv.innerHTML = html;
  }

  // ============ VIEW SWITCHING ============
  function switchView(view){
    if ('speechSynthesis' in window){ window.speechSynthesis.cancel(); speakingId=null; }
    currentView = view;
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    $(view+'View').classList.add('active');
    if (view==='map') renderMap();
    if (view==='stats') renderStats();
  }

  function renderAll(){ renderHeader(); renderFeed(); if (currentView==='map') renderMap(); if (currentView==='stats') renderStats(); }

  function openCategoryModal(){
    sessionCategories=[]; sessionPhotos=[]; sessionVideos=[];

      return `<button class="cat-chip" data-cat="${c.id}" style="--cat-color:${c.color};--cat-tint:${c.color}1f;--cat-shadow:${c.color}66" onclick="toggleCategory(this,'${c.id}')"><span class="cat-emoji">${c.emoji}</span><span class="cat-label">${escapeHtml(label)}</span></button>`;

  function toggleCategory(btn,id){
    const i=sessionCategories.indexOf(id);
    if (i>=0){ sessionCategories.splice(i,1); btn.classList.remove('selected'); }
    else { sessionCategories.push(id); btn.classList.add('selected'); }
    const c=$('catCounter'); if(c){ if(sessionCategories.length){ c.textContent=sessionCategories.length; c.style.display='inline-flex'; } else c.style.display='none'; }
  }

  async function buildExportDoc(forPrint){
    const trip = state.trips.find(tr=>tr.id===state.currentTripId);
    const entries = currentTripEntries().sort((a,b)=>a.timestamp-b.timestamp);
    if (!trip || entries.length===0){ return null; }

    const dir = lang==='he' ? 'rtl' : 'ltr';
    const isHe = lang==='he';
    const journalLabel = journalType==='shared' ? t('viewing_shared') : t('viewing_personal');

    // overview stats
    const countries = new Set(), cities = new Set();
    entries.forEach(e=>{ if(e.location){ if(e.location.country) countries.add(e.location.country); if(e.location.city) cities.add(e.location.city); } });
    const distinctDays = new Set(entries.map(e=>dateKey(e.timestamp))).size;

    // build day groups
    const groups = {};
    entries.forEach(e=>{ const k=dateKey(e.timestamp); (groups[k]=groups[k]||[]).push(e); });

    let daysHtml = '';
    for (const k of Object.keys(groups).sort()){
      const de = groups[k]; const d = new Date(de[0].timestamp);
      const dayNum = daysSince(trip.startDate, d.toISOString());
      const locs = de.map(e=>e.location).filter(Boolean);
      const city = locs.map(l=>l.city).filter(Boolean)[0]||'';
      const country = locs.map(l=>l.country).filter(Boolean)[0]||'';
      const locLine = [city,country].filter(Boolean).join(', ');
      let entriesHtml = '';
      for (const e of de){
        const tm = new Date(e.timestamp);
        const eLoc = e.location ? [e.location.city,e.location.country].filter(Boolean).join(', ') : '';
        const tags = (e.categories||[]).map(cid=>{ const c=catById(cid); if(!c) return ''; return `<span class="tag" style="--c:${c.color}">${c.emoji} ${escapeHtml(c[lang]||c.en)}</span>`; }).join('');
        let photosHtml = '';
        if (e.photos && e.photos.length){
          for (const pid of e.photos){ const url = await photoDB.get(pid); if (url) photosHtml += `<img class="photo" src="${url}" alt="">`; }
          if (photosHtml) photosHtml = `<div class="photos">${photosHtml}</div>`;
        }
        entriesHtml += `<div class="entry">
          <div class="entry-head"><span class="time">${fmtTime(tm)}</span>${eLoc?`<span class="loc">⌖ ${escapeHtml(eLoc)}</span>`:''}</div>
          ${tags?`<div class="tags">${tags}</div>`:''}
          ${e.text?`<div class="text">${escapeHtml(e.text)}</div>`:''}
          ${photosHtml}
        </div>`;
      }
      daysHtml += `<div class="day">
        <div class="day-head"><div class="stamp"><div class="n">${dayNum}</div><div class="l">${escapeHtml(t('day_label'))}</div></div>
        <div class="day-meta"><div class="date">${escapeHtml(I18N[lang].days_full[d.getDay()])}, ${escapeHtml(fmtDate(d))}</div>${locLine?`<div class="dl">${escapeHtml(locLine)}</div>`:''}</div></div>
        ${entriesHtml}</div>`;
    }

    const startD = new Date(trip.startDate);
    const doc = `<!DOCTYPE html><html lang="${lang}" dir="${dir}"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(trip.name)} — Trip diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#061521;--panel:#0e2a3d;--card:#0d2535;--ink:#eaf6fb;--ink-soft:#b6d4e0;--muted:#7896a6;--line:rgba(94,234,212,0.14);--line2:rgba(94,234,212,0.28);--turq:#14b8a6;--turql:#5eead4;--cyan:#22d3ee;--sky:#38bdf8;--grad:linear-gradient(135deg,#22d3ee 0%,#14b8a6 100%)}
body{font-family:'Rubik',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
background-image:radial-gradient(ellipse 60% 40% at 80% 0%,rgba(34,211,238,0.10) 0%,transparent 55%),radial-gradient(ellipse 50% 40% at 10% 30%,rgba(20,184,166,0.08) 0%,transparent 55%);min-height:100vh;padding:0 0 50px}
.wrap{max-width:760px;margin:0 auto;padding:0 22px}
.cover{text-align:center;padding:58px 22px 36px}
.logo{width:96px;height:96px;border-radius:26px;object-fit:contain;margin:0 auto 22px;display:block;filter:drop-shadow(0 16px 36px rgba(8,145,178,0.45))}
.brand{font-size:15px;font-weight:700;letter-spacing:-0.02em;color:var(--muted);margin-bottom:16px}
.brand .d{color:var(--turql);font-style:italic;font-weight:600}
.cover h1{font-size:clamp(30px,7vw,46px);font-weight:900;letter-spacing:-0.03em;line-height:1.05;margin-bottom:12px}
.cover .sub{color:var(--muted);font-size:15px;font-weight:500}
.jbadge{display:inline-block;margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--turql);padding:6px 14px;border:1px solid var(--line2);border-radius:100px;background:rgba(20,184,166,0.06)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:30px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 12px;text-align:center}
.stat .n{font-size:28px;font-weight:900;letter-spacing:-0.02em;color:var(--turql);line-height:1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:7px;font-weight:500}
.divider{height:1px;background:var(--line);margin:34px 0 28px}
.day{margin-bottom:30px}
.day-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:13px 15px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.stamp{display:flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:56px;border-radius:16px;background:var(--grad);color:#04222b;flex-shrink:0;box-shadow:0 6px 16px -5px rgba(20,184,166,0.55)}
.stamp .n{font-weight:900;font-size:22px;line-height:1}
.stamp .l{font-size:9px;text-transform:uppercase;letter-spacing:0.1em;margin-top:2px;font-weight:700;opacity:0.85}
.day-meta .date{font-weight:700;font-size:17px;letter-spacing:-0.01em}
.day-meta .dl{font-size:13px;color:var(--muted);margin-top:3px;font-weight:500}
.entry{background:var(--card);border:1px solid var(--line);border-${isHe?'right':'left'}:3px solid var(--cyan);border-radius:16px;padding:16px 18px;margin-bottom:12px;margin-${isHe?'right':'left'}:20px}
.entry-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.time{font-family:'JetBrains Mono',monospace;color:var(--turql);font-weight:500;font-size:13px}
.loc{color:var(--muted);font-size:12px;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:100px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.text{font-size:15.5px;line-height:1.8;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.photo{width:130px;height:130px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.foot .fb{font-weight:700;color:var(--ink-soft);margin-bottom:5px}
.foot .fb .d{color:var(--turql);font-style:italic}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.photo{width:calc(50% - 4px);height:140px}}

</style></head><body>
